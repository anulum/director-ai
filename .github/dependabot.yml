# Director-Class AI — Dependabot Configuration
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Open update PRs (was 0 = disabled). Minor/patch are grouped into one PR to
    # keep noise down; major bumps stay separate so they get individual review
    # and migration per the no-deferred-dep-upgrades policy.
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    exclude-paths:
      - "requirements/**"
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "python"

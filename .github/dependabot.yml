# Director-AI — Dependabot Configuration
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Open update PRs (was 0 = disabled). Minor/patch are grouped into one PR to
    # keep noise down; major bumps stay separate so they get individual review
    # and migration per the no-deferred-dep-upgrades policy.
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "python"
    # crewai 1.x pins json-repair exactly (==0.25.2) and caps chromadb at
    # ~=1.1.0, so a standalone bump of either can only resolve by downgrading
    # crewai to the ancient 0.95.0 line — which is exactly what the #148/#149
    # updates did before being reverted. Both move together with a crewai
    # upgrade instead; chromadb 1.1.x patches stay allowed.
    ignore:
      - dependency-name: "json-repair"
      - dependency-name: "chromadb"
        versions: [">=1.2"]

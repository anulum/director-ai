# DIRECTOR-AI — OpenSSF analysis
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyse with immutable OpenSSF image
        uses: docker://ghcr.io/ossf/scorecard-action@sha256:ae5104dd3cc28466ebeb11144354be4cac4b7ff829654f9fab89021d71c46670
        env:
          INPUT_RESULTS_FILE: results.sarif
          INPUT_RESULTS_FORMAT: sarif
          INPUT_FILE_MODE: archive
          INPUT_REPO_TOKEN: ${{ github.token }}
          INPUT_INTERNAL_DEFAULT_TOKEN: ${{ github.token }}
          INPUT_PUBLISH_RESULTS: "false"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif

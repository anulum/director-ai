name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v3.4.0)"
        required: true

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        run: |
          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::No release tag resolved (RELEASE_TAG is empty). Trigger via a published Release, or dispatch with the required 'tag' input (e.g. tag=v3.21.0). Refusing to check out an empty ref."
            exit 1
          fi
          case "${RELEASE_TAG}" in
            v[0-9]*) : ;;
            *) echo "::error::Release tag '${RELEASE_TAG}' is not a vX.Y.Z tag; refusing to proceed."; exit 1 ;;
          esac
          echo "Release tag: ${RELEASE_TAG}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --require-hashes -r requirements/ci-release.txt

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Verify the free wheel is core-only (D1 re-slice)
        # Contents check + unpacked-wheel import simulation: no paid packages
        # or paid single modules may reach the public artefact, and the lazy
        # facades must raise the friendly "advanced tier" error.
        run: python scripts/check_free_wheel.py dist

      - name: Generate SBOM
        run: cyclonedx-py environment -o sbom.json --of json

      - name: Record distribution checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t distributions < <(
            find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.whl' \) \
              -print | LC_ALL=C sort
          )
          if [ "${#distributions[@]}" -ne 2 ]; then
            echo "::error::Expected one Core sdist and one Core wheel, found ${#distributions[@]}."
            exit 1
          fi
          sha256sum -- "${distributions[@]}" > dist-sha256.txt
          sha256sum --check dist-sha256.txt

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.json

      - name: Upload distribution checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-sha256
          path: dist-sha256.txt

  sign:
    name: Sigstore Sign
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Download distribution checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-sha256

      - name: Verify distribution checksums
        run: sha256sum --check dist-sha256.txt

      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: dist/*

      - name: Upload signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sigstore
          path: |
            dist/*.sigstore.json

  provenance:
    name: SLSA Provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Download distribution checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-sha256

      - name: Verify distribution checksums
        run: sha256sum --check dist-sha256.txt

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*

  # director-ai only. director-ai-lite publishes from its own workflow
  # (publish-lite.yml) so each PyPI project maps to a distinct trusted-publisher
  # workflow filename and the minted OIDC token is never ambiguous.
  publish:
    name: Publish
    needs: [build, sign, provenance]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Download distribution checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-sha256

      - name: Verify distribution checksums
        run: sha256sum --check dist-sha256.txt

      - name: Refuse paid artefacts on the public lane
        # Hard gate (decision D3): director-ai-pro / director-ai-full are
        # BUSL wheels for the private index only. If one ever appears here,
        # a public copy could shadow the private index for every customer
        # (dependency confusion) — fail the release instead.
        run: |
          shopt -s nullglob
          core_present=false
          for artefact in dist/*; do
            case "${artefact##*/}" in
              director_ai_pro-*|director_ai_full-*)
                echo "FATAL: paid tier artefact found in the public PyPI lane"
                exit 1
                ;;
              director_ai-*) core_present=true ;;
            esac
          done
          if [ "$core_present" != true ]; then
            echo "FATAL: free core artefact missing from dist/"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  attach-artifacts:
    name: Attach Published Distribution + Evidence to Release
    needs: [build, sign, provenance, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download published distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Download distribution checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-sha256

      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom

      - name: Download Sigstore signatures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sigstore
          path: sigstore/

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha256sum --check dist-sha256.txt
          gh release upload "$RELEASE_TAG" \
            dist/* dist-sha256.txt sbom.json sigstore/*.sigstore.json \
            --repo "$GITHUB_REPOSITORY"

  discord-announce:
    name: Discord Release Announcement
    runs-on: ubuntu-latest
    needs: [publish, attach-artifacts]
    # A missing DISCORD_ANNOUNCE_WEBHOOK secret (or an empty changelog section)
    # must never red the publish run — the PyPI upload has already succeeded by
    # the time this job runs. The Post step is also gated on the secret below.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract changelog bullets
        id: changelog
        run: |
          VERSION="${RELEASE_TAG#v}"
          BULLETS=$(sed -n "/^## \[${VERSION}\]/,/^## \[/{/^## \[${VERSION}\]/d;/^## \[/d;/^$/d;p;}" CHANGELOG.md \
            | grep -E '^\s*-' | head -5 | sed 's/^ *- *//' | jq -Rsc 'split("\n") | map(select(length>0))')
          echo "bullets=${BULLETS}" >> "$GITHUB_OUTPUT"

      - name: Post to Discord
        if: env.DISCORD_ANNOUNCE_WEBHOOK != ''
        env:
          DISCORD_ANNOUNCE_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          BULLETS='${{ steps.changelog.outputs.bullets }}'
          DESC=$(echo "$BULLETS" | jq -r 'map("- " + .) | join("\n")' 2>/dev/null || echo "See release notes.")
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          curl -sf -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"Director-AI v${VERSION} released\",
              \"description\": $(echo "$DESC" | jq -Rs .),
              \"color\": 5793266,
              \"url\": \"${RELEASE_URL}\",
              \"fields\": [
                {\"name\": \"Install\", \"value\": \"\`\`\`\\npip install director-ai==${VERSION}\\n\`\`\`\", \"inline\": false},
                {\"name\": \"Links\", \"value\": \"[PyPI](https://pypi.org/project/director-ai/${VERSION}/) · [Release](${RELEASE_URL}) · [Docs](https://anulum.github.io/director-ai/) · [Docker](https://ghcr.io/anulum/director-ai)\", \"inline\": false}
              ],
              \"footer\": {\"text\": \"${GITHUB_REPOSITORY}\", \"icon_url\": \"https://github.com/anulum.png\"},
              \"timestamp\": \"${TIMESTAMP}\"
            }]
          }" "$DISCORD_ANNOUNCE_WEBHOOK"

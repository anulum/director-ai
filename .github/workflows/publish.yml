name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v3.4.0)"
        required: true

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --require-hashes -r requirements/ci-release.txt

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Verify the free wheel is core-only (D1 re-slice)
        # Contents check + unpacked-wheel import simulation: no paid packages
        # or paid single modules may reach the public artefact, and the lazy
        # facades must raise the friendly "advanced tier" error.
        run: python scripts/check_free_wheel.py dist

      - name: Generate SBOM
        run: cyclonedx-py environment -o sbom.json --of json

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.json

  sign:
    name: Sigstore Sign
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: dist/*

      - name: Upload signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sigstore
          path: |
            dist/*.sigstore.json

  provenance:
    name: SLSA Provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*

  # director-ai only. director-ai-lite publishes from its own workflow
  # (publish-lite.yml) so each PyPI project maps to a distinct trusted-publisher
  # workflow filename and the minted OIDC token is never ambiguous.
  publish:
    name: Publish
    needs: [build, sign]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Refuse paid artefacts on the public lane
        # Hard gate (decision D3): director-ai-pro / director-ai-full are
        # BUSL wheels for the private index only. If one ever appears here,
        # a public copy could shadow the private index for every customer
        # (dependency confusion) — fail the release instead.
        run: |
          if ls dist/ | grep -E '^director_ai_(pro|full)-'; then
            echo "FATAL: paid tier artefact found in the public PyPI lane"
            exit 1
          fi
          ls dist/ | grep -E '^director_ai-' >/dev/null \
            || { echo "FATAL: free core artefact missing from dist/"; exit 1; }

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

  attach-artifacts:
    name: Attach SBOM + Signatures to Release
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom

      - name: Download Sigstore signatures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sigstore
          path: sigstore/

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" sbom.json --clobber
          for sig in sigstore/*.sigstore.json; do
            [ -f "$sig" ] && gh release upload "$RELEASE_TAG" "$sig" --clobber
          done

  discord-announce:
    name: Discord Release Announcement
    runs-on: ubuntu-latest
    needs: [publish, attach-artifacts]
    # A missing DISCORD_ANNOUNCE_WEBHOOK secret (or an empty changelog section)
    # must never red the publish run — the PyPI upload has already succeeded by
    # the time this job runs. The Post step is also gated on the secret below.
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Extract changelog bullets
        id: changelog
        run: |
          VERSION="${RELEASE_TAG#v}"
          BULLETS=$(sed -n "/^## \[${VERSION}\]/,/^## \[/{/^## \[${VERSION}\]/d;/^## \[/d;/^$/d;p;}" CHANGELOG.md \
            | grep -E '^\s*-' | head -5 | sed 's/^ *- *//' | jq -Rsc 'split("\n") | map(select(length>0))')
          echo "bullets=${BULLETS}" >> "$GITHUB_OUTPUT"

      - name: Post to Discord
        if: env.DISCORD_ANNOUNCE_WEBHOOK != ''
        env:
          DISCORD_ANNOUNCE_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          BULLETS='${{ steps.changelog.outputs.bullets }}'
          DESC=$(echo "$BULLETS" | jq -r 'map("- " + .) | join("\n")' 2>/dev/null || echo "See release notes.")
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          curl -sf -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"Director-AI v${VERSION} released\",
              \"description\": $(echo "$DESC" | jq -Rs .),
              \"color\": 5793266,
              \"url\": \"${RELEASE_URL}\",
              \"fields\": [
                {\"name\": \"Install\", \"value\": \"\`\`\`\\npip install director-ai==${VERSION}\\n\`\`\`\", \"inline\": false},
                {\"name\": \"Links\", \"value\": \"[PyPI](https://pypi.org/project/director-ai/${VERSION}/) · [Release](${RELEASE_URL}) · [Docs](https://anulum.github.io/director-ai/) · [Docker](https://ghcr.io/anulum/director-ai)\", \"inline\": false}
              ],
              \"footer\": {\"text\": \"${GITHUB_REPOSITORY}\", \"icon_url\": \"https://github.com/anulum.png\"},
              \"timestamp\": \"${TIMESTAMP}\"
            }]
          }" "$DISCORD_ANNOUNCE_WEBHOOK"

name: Publish Director-Lite to PyPI

# director-ai-lite publishes from its OWN workflow file so its PyPI trusted
# publisher (workflow: publish-lite.yml) is matched unambiguously and the minted
# OIDC token is always scoped to director-ai-lite — never the core project.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v3.18.1)"
        required: true

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish-lite:
    name: Build + publish director-ai-lite
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Validate release tag
        run: |
          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::No release tag resolved (RELEASE_TAG is empty). Trigger via a published Release, or dispatch with the required 'tag' input (e.g. tag=v3.19.0). Refusing to check out an empty ref."
            exit 1
          fi
          case "${RELEASE_TAG}" in
            v[0-9]*) : ;;
            *) echo "::error::Release tag '${RELEASE_TAG}' is not a vX.Y.Z tag; refusing to proceed."; exit 1 ;;
          esac
          echo "Release tag: ${RELEASE_TAG}"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --require-hashes -r requirements/ci-release.txt

      - name: Build director-ai-lite
        run: python -m build packages/director-ai-lite --outdir dist-lite

      - name: Check distribution
        run: twine check dist-lite/*

      - name: Publish director-ai-lite to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist-lite/

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --require-hashes -r requirements/ci-release.txt

      - name: Build sdist and wheel
        run: python -m build

      - name: Generate SBOM
        run: cyclonedx-py environment -o sbom.json --output-format json

      - name: Extract changelog for this tag
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # Print the section body between this version's heading and the next
          # "## [" heading, excluding both. A plain awk range /start/,/end/ fails
          # here because the version heading matches the end pattern too, closing
          # the range on its own line and yielding only the heading.
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[?" ver) { flag = 1; next }
            flag && /^## \[?[0-9]/ { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      # Create the Release with RELEASE_PAT when it is configured. A Release
      # created by the default GITHUB_TOKEN does NOT emit `release: published`
      # (GitHub anti-recursion), so publish.yml / publish-lite.yml never fire and
      # PyPI upload has to be dispatched by hand. A fine-grained PAT (contents:
      # write on this repo) restores the automatic chain. Without the secret it
      # falls back to GITHUB_TOKEN — same one-click-blocked behaviour as before,
      # so this is safe to leave unset.
      #   Operator setup (one-time): add repository secret RELEASE_PAT.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          generate_release_notes: false
          files: |
            dist/*.tar.gz
            dist/*.whl
            sbom.json

  # PyPI publishing handled by publish.yml (triggered by release: [published]).
  # Do NOT add a publish job here — the trusted publisher is configured for
  # publish.yml. The release:published trigger only fires when the Release above
  # is created with RELEASE_PAT (see the note on that step); otherwise dispatch
  # publish.yml and publish-lite.yml manually with the tag.

# Director-AI — continuous integration
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    uses: ./.github/workflows/ci-static.yml

  lite:
    uses: ./.github/workflows/ci-lite.yml

  packages:
    uses: ./.github/workflows/ci-packages.yml

  python:
    uses: ./.github/workflows/ci-python.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  floor:
    uses: ./.github/workflows/ci-floor.yml

  extras:
    uses: ./.github/workflows/ci-extras.yml

  security:
    uses: ./.github/workflows/ci-security.yml

  sbom:
    needs: [python]
    uses: ./.github/workflows/ci-sbom.yml

  fuzz:
    needs: [python]
    uses: ./.github/workflows/ci-fuzz.yml

  benchmark:
    needs: [python]
    uses: ./.github/workflows/ci-benchmark.yml

  runtime:
    needs: [python]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/ci-runtime.yml

  rust:
    uses: ./.github/workflows/ci-rust.yml

  lean:
    uses: ./.github/workflows/ci-lean.yml

  notify:
    needs: [static, python, extras, security, fuzz, benchmark, rust, lean]
    if: always() && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-notify.yml
    with:
      results: >-
        {"lint": "${{ needs.static.outputs.lint }}", "typecheck": "${{ needs.static.outputs.typecheck }}", "test": "${{ needs.python.result }}", "test-extras": "${{ needs.extras.result }}", "security": "${{ needs.security.outputs.security }}", "fuzz": "${{ needs.fuzz.result }}", "sast": "${{ needs.security.outputs.sast }}", "benchmark": "${{ needs.benchmark.result }}", "rust": "${{ needs.rust.result }}", "lean": "${{ needs.lean.result }}"}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  ci-gate:
    # One aggregate definition preserves both existing branch-protection names.
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    if: always()
    needs: [static, lite, packages, python, floor, extras, security, sbom, fuzz, benchmark, runtime, rust, lean, notify]
    strategy:
      fail-fast: false
      matrix:
        check: ["Test (Python 3.11)", "Lint & Format"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Require every applicable CI category
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
          CI_EVENT: ${{ github.event_name }}
        run: python -m tools.check_ci_gate --event "$CI_EVENT"

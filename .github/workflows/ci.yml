name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_HTTP_TIMEOUT: "60"
  CARGO_NET_RETRY: "10"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install --require-hashes -r requirements/ci-lint.txt

      - name: Version consistency
        run: python -c "from tools.preflight import check_version_sync; raise SystemExit(0 if check_version_sync() else 1)"

      - name: Capability manifest drift
        run: python tools/capability_manifest.py --check

      - name: Studio federation manifest drift
        run: PYTHONPATH=src python tools/emit_studio_manifest.py --check

      - name: Test surface policy
        run: python tools/check_test_surface_policy.py --root .

      - name: Capability matrix ratchet
        run: python tools/capability_matrix.py --check

      - name: Mojibake guard (source tree)
        run: python tools/check_mojibake.py --root .

      - name: Check formatting (ruff)
        run: ruff format --check src/ tests/ examples/

      - name: Lint (ruff)
        run: ruff check src/ tests/ examples/

      - name: Docstring ratchet (source tree)
        run: ruff check src/director_ai --select D

      - name: REUSE compliance (SPDX licensing)
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  director-lite:
    name: Director-Lite (standalone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install tools
        # Hash-pinned, matching the rest of CI (ruff/mypy/pytest/pytest-cov live
        # in the dev lock); keeps the Scorecard Pinned-Dependencies check clean.
        run: pip install --require-hashes --no-deps -r requirements/ci-dev.txt

      - name: Ruff format + lint
        run: |
          ruff format --check packages/director-ai-lite/
          ruff check packages/director-ai-lite/

      - name: Type check (strict)
        run: mypy packages/director-ai-lite/src/director_ai_lite --strict

      - name: Tests (100% coverage, standalone)
        run: |
          # The env has only the dev toolchain (no director-ai), so running the
          # suite against the source proves the package is genuinely standalone.
          cd packages/director-ai-lite
          PYTHONPATH=src pytest tests/ -q \
            --cov=director_ai_lite --cov-report=term-missing --cov-fail-under=100

  paid-tiers:
    name: Paid tiers (pro + full) build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --require-hashes --no-deps -r requirements/ci-release.txt

      - name: Build + check the BUSL paid wheels
        run: |
          # Each paid wheel builds from the shared ../../src tree and layers the
          # advanced/labs packages into the director_ai namespace WITHOUT shipping
          # a parent __init__ (so it installs alongside the free Apache core).
          for tier in pro full; do
            python -m build --wheel "packages/director-ai-$tier" --outdir "dist-$tier"
            twine check "dist-$tier"/*
            python scripts/check_paid_wheel.py "dist-$tier" "$tier"
          done

      - name: Build + check the free core wheel
        run: |
          # The free wheel must stay core-only after the D1 re-slice: no paid
          # packages, no paid single modules, and the unpacked wheel must import
          # standalone with the friendly "advanced tier" boundary errors.
          python -m build --wheel . --outdir dist-free
          twine check dist-free/*
          python scripts/check_free_wheel.py dist-free

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --require-hashes --no-deps -r requirements/ci-dev.txt
          maturin build --release --manifest-path backfire-kernel/crates/backfire-ffi/Cargo.toml --out dist/backfire-kernel
          python -m pip install --force-reinstall --no-deps --no-index dist/backfire-kernel/backfire_kernel-*.whl
          pip install --no-deps -e .

      - name: Install type stubs
        run: pip install --require-hashes -r requirements/ci-types.txt

      - name: Run mypy
        run: mypy src/director_ai/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --require-hashes --no-deps -r requirements/ci-dev.txt
          maturin build --release --manifest-path backfire-kernel/crates/backfire-ffi/Cargo.toml --out dist/backfire-kernel
          python -m pip install --force-reinstall --no-deps --no-index dist/backfire-kernel/backfire_kernel-*.whl
          pip install --no-deps -e .

      - name: Run tests with coverage
        # Gate at 97%: module-specific tests for the new modules have landed and
        # the full-suite total is 97.07% (measured 2026-06-14).
        run: pytest tests/ -v --tb=short --cov=director_ai --cov-report=term-missing --cov-report=xml --cov-fail-under=97

      - name: Verify pure-Python import
        if: matrix.python-version == '3.12'
        run: python -c "import director_ai; assert director_ai.__version__"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage.xml

  floor:
    name: Pure-Python floor (no rust extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install the base floor without the compiled kernel
        # A base `pip install director-ai` resolves the pure-Python floor
        # (ADR-0001). Install the dev/test deps, drop backfire-kernel, and never
        # build it — the kernel is now the opt-in `[rust]` extra, not a base dep.
        run: |
          pip install --require-hashes --no-deps -r requirements/ci-dev.txt
          pip uninstall -y backfire-kernel
          pip install --no-deps -e .

      - name: Assert the compiled kernel is genuinely absent
        run: |
          python - <<'PY'
          import importlib.util
          import sys

          if importlib.util.find_spec("backfire_kernel") is not None:
              sys.exit("backfire_kernel is present; the floor job would not test the floor")
          print("backfire_kernel absent — floor conditions hold")
          PY

      - name: Base install imports and reviews in pure Python
        run: |
          python - <<'PY'
          import director_ai
          from director_ai.core import CoherenceScorer

          assert director_ai.__version__
          approved, score = CoherenceScorer(use_nli=False).review(
              "What is 2+2? Explain.", "The answer is 4 because 2+2=4."
          )
          assert isinstance(approved, bool)
          print(f"floor review OK: approved={approved} score={score.score:.4f}")
          PY

      - name: Run the pure-Python floor test suite
        run: pytest tests/test_rust_fallback_floor.py tests/test_accelerator_fallback_parity.py -v --tb=short

  test-extras:
    name: Test extras (${{ matrix.extras }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        extras:
          - "dev,server"
          - "dev,grpc"
          - "dev,faiss"
          - "dev,rust"
          - "dev,formal"
          - "dev,finetune,train,managed-training"
          - "dev,openai,anthropic"
          - "dev,langchain"
          - "dev,llamaindex"
          - "dev,voice"
          - "dev,reports"
          - "dev,honesty"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false

      - name: Install WeasyPrint system libraries
        if: contains(matrix.extras, 'reports')
        # WeasyPrint renders text via Pango; these are its only native deps on
        # Debian/Ubuntu (it no longer needs cairo since v53).
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Install with extras
        run: |
          IFS=, read -ra EXTRA_NAMES <<< "${{ matrix.extras }}"
          UV_EXTRAS=()
          for extra in "${EXTRA_NAMES[@]}"; do
            UV_EXTRAS+=(--extra "$extra")
          done
          uv sync --locked "${UV_EXTRAS[@]}"
          uv run maturin develop --release --manifest-path backfire-kernel/crates/backfire-ffi/Cargo.toml

      - name: Import smoke test
        run: uv run python -c "import director_ai; assert director_ai.__version__"

      - name: Extras-specific import check
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          uv run python - <<'PY'
          import importlib
          import os

          extras = set(os.environ["EXTRAS"].split(","))

          if "server" in extras:
              from director_ai.server import create_app

              assert create_app
              print("server OK")
          if "grpc" in extras:
              from director_ai.grpc_server import create_grpc_server

              assert create_grpc_server
              print("grpc OK")
          if "faiss" in extras:
              import faiss
              from director_ai.core.retrieval.vector_store import FAISSBackend

              assert faiss
              assert FAISSBackend
              print("faiss OK")
          if "rust" in extras:
              import backfire_kernel
              from director_ai.core.scoring.backends import RustBackend

              assert backfire_kernel
              RustBackend()
              print("rust OK")
          if "formal" in extras:
              import z3
              from director_ai.core.formal_verification import (
                  ReasoningStep,
                  ReasoningVerifier,
                  Variable,
                  Z3Backend,
              )

              assert z3
              ReasoningVerifier(backend=Z3Backend.from_z3()).verify(
                  [ReasoningStep("p", Variable("p"))]
              )
              print("formal OK")
          if "finetune" in extras:
              import accelerate
              import datasets
              import sklearn
              import torch
              import transformers
              from director_ai.core.training.finetune import FinetuneConfig

              assert accelerate and datasets and sklearn and torch and transformers
              assert FinetuneConfig
              print("finetune OK")
          if "train" in extras:
              import accelerate
              import datasets
              import peft
              import transformers
              from director_ai.core.training.finetune_benchmark import (
                  benchmark_finetuned_model,
              )

              assert accelerate and datasets and peft and transformers
              assert benchmark_finetuned_model
              print("train OK")
          if "managed-training" in extras:
              importlib.import_module("google.cloud.aiplatform")
              importlib.import_module("google.cloud.storage")
              from director_ai.core.training.jobs import TrainingJobSpec

              assert TrainingJobSpec
              print("managed-training OK")
          if "openai" in extras:
              import openai

              assert openai
              print("openai OK")
          if "anthropic" in extras:
              import anthropic

              assert anthropic
              print("anthropic OK")
          if "langchain" in extras:
              import langchain_core

              assert langchain_core
              print("langchain OK")
          if "llamaindex" in extras:
              # The integration adapter stays importable without the optional
              # upstream stack. The llama-index-core package is deliberately not
              # installed while its dependency chain pulls an unpatched nltk
              # advisory; see pyproject.toml next to the empty extra.
              from director_ai.integrations.llamaindex import DirectorAIPostprocessor

              assert DirectorAIPostprocessor
              print("llamaindex adapter OK")
          if "voice" in extras:
              from director_ai.voice import AsyncVoiceGuard, TTSAdapter

              assert AsyncVoiceGuard and TTSAdapter
              print("voice OK")
          if "reports" in extras:
              from director_ai.compliance.report_templates import (
                  html_to_pdf,
                  render_compliance_pdf,
              )

              assert render_compliance_pdf
              assert html_to_pdf("<h1>ci</h1>").startswith(b"%PDF")
              print("reports OK")
          PY

      - name: Run tests with coverage
        run: |
          TEST_TARGETS=()
          case ",${{ matrix.extras }}," in
            *,server,*)
              TEST_TARGETS+=(
                tests/test_server.py
                tests/test_server_audit.py
                tests/test_server_auth.py
                tests/test_server_compliance.py
                tests/test_server_feedback.py
                tests/test_server_tenant.py
                tests/test_server_ws_mux.py
                tests/test_inference_server_hooks.py
              )
              ;;
          esac
          case ",${{ matrix.extras }}," in
            *,grpc,*)
              TEST_TARGETS+=(
                tests/test_grpc_server.py
                tests/test_grpc_scoring.py
              )
              ;;
          esac
          case ",${{ matrix.extras }}," in
            *,faiss,*)
              TEST_TARGETS+=(
                tests/test_vector_store.py
                tests/test_vector_store_backends.py
                tests/test_vector_store_reranker.py
              )
              ;;
          esac
          case ",${{ matrix.extras }}," in
            *,rust,*)
              TEST_TARGETS+=(tests/test_ffi_bindings.py)
              ;;
          esac
          case ",${{ matrix.extras }}," in
            *,formal,*)
              TEST_TARGETS+=(
                tests/test_formal_verification.py
                tests/test_conformal.py
                tests/test_neuro_symbolic.py
                tests/test_neuro_symbolic_verifier.py
              )
              ;;
          esac
          case ",${{ matrix.extras }}," in
            *,finetune,*|*,train,*|*,managed-training,*)
              TEST_TARGETS+=(
                tests/test_finetune.py
                tests/test_finetune_api.py
                tests/test_finetune_benchmark.py
                tests/test_finetune_validator.py
                tests/test_managed_training_jobs.py
                tests/test_training_model_registry.py
              )
              ;;
          esac
          case ",${{ matrix.extras }}," in
            *,openai,*|*,anthropic,*)
              TEST_TARGETS+=(
                tests/test_agent_providers.py
                tests/test_providers.py
                tests/test_openai_swarm.py
              )
              ;;
          esac
          case ",${{ matrix.extras }}," in
            *,langchain,*)
              TEST_TARGETS+=(
                tests/test_langchain_callback.py
                tests/test_langchain_real_sdk.py
              )
              ;;
          esac
          case ",${{ matrix.extras }}," in
            *,llamaindex,*)
              TEST_TARGETS+=(tests/test_llamaindex.py tests/test_llamaindex_real_sdk.py)
              ;;
          esac
          case ",${{ matrix.extras }}," in
            *,voice,*)
              TEST_TARGETS+=(
                tests/test_voice_adapters.py
                tests/test_voice_adapters_real_surface.py
                tests/test_voice_adapters_sdk.py
                tests/test_voice_async_guard.py
                tests/test_voice_guard.py
                tests/test_voice_pipeline.py
              )
              ;;
          esac
          case ",${{ matrix.extras }}," in
            *,reports,*)
              TEST_TARGETS+=(tests/test_report_templates.py)
              ;;
          esac
          case ",${{ matrix.extras }}," in
            *,honesty,*)
              TEST_TARGETS+=(tests/test_honesty_redteam.py)
              ;;
          esac
          if [ "${#TEST_TARGETS[@]}" -eq 0 ]; then
            echo "::error::No extras-specific tests configured for ${{ matrix.extras }}"
            exit 1
          fi
          uv run pytest "${TEST_TARGETS[@]}" -v --tb=short \
            --cov=director_ai \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-config=.coveragerc-extras \
            --cov-fail-under=0

      - name: Upload extras coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-extras-${{ matrix.extras }}
          path: coverage.xml

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Validate security exception register
        # Enforcing: a malformed or EXPIRED accepted-finding entry fails the
        # build, so tolerated advisories cannot become silent permanent debt.
        run: python -m tools.check_security_exceptions

      - name: Install pip-audit
        run: pip install --require-hashes -r requirements/ci-audit.txt

      - name: Audit dependencies
        # Fail closed: audit the core requirements and the production server
        # dependency closure. Both were clean at flip time (2026-06-07); any new
        # advisory now blocks the build. Accepted findings must be added to the
        # governed exception register (validated above) and passed via
        # --ignore-vuln; there are none currently.
        run: |
          pip-audit --strict --desc on -r requirements.txt
          pip-audit --strict --desc on -r requirements/docker-server.txt

      - name: Export vulnerability disclosure reports (CycloneDX VDR)
        # Machine-readable exploitability statements (WCG-1): a CycloneDX BOM
        # with the vulnerabilities[] analysis for each audited dependency set —
        # the VEX-equivalent record; the governed exception register above is
        # the not-affected justification trail.
        run: |
          pip-audit --format cyclonedx-json -o vdr-core.json -r requirements.txt
          pip-audit --format cyclonedx-json -o vdr-docker-server.json -r requirements/docker-server.txt

      - name: Upload VDR artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vdr
          path: vdr-*.json
          if-no-files-found: ignore

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --require-hashes --no-deps -r requirements/ci-dev.txt
          pip install --no-deps -e .
          pip install --require-hashes -r requirements/ci-sbom.txt

      - name: Generate SBOM (installed environment, resolved versions)
        run: cyclonedx-py environment -o sbom.json --of json

      - name: Generate SBOM (hashed dependency lock)
        # Pinned + hashed supply-chain inventory (WCG-1): every component is an
        # exact ==version from the pip-compile --generate-hashes lock and its
        # requirement line (including all --hash values) is captured verbatim.
        run: cyclonedx-py requirements requirements/ci-dev.txt -o sbom-lock.json --of json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: |
            sbom.json
            sbom-lock.json

  fuzz:
    name: Fuzz (Hypothesis)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --require-hashes --no-deps -r requirements/ci-dev.txt
          maturin build --release --manifest-path backfire-kernel/crates/backfire-ffi/Cargo.toml --out dist/backfire-kernel
          python -m pip install --force-reinstall --no-deps --no-index dist/backfire-kernel/backfire_kernel-*.whl
          pip install --no-deps -e .
          pip install --require-hashes -r requirements/ci-fuzz.txt

      - name: Run property-based fuzz tests
        run: pytest tests/test_fuzz.py -v --hypothesis-seed=0
        env:
          HYPOTHESIS_MAX_EXAMPLES: "200"

  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install SAST tools
        run: pip install --require-hashes -r requirements/ci-sast.txt

      - name: Run Bandit
        run: bandit -r src/director_ai/ -c pyproject.toml

      - name: Run Semgrep
        # Enforcing (--error): scoped to the shipped library `src/director_ai/`
        # (matching the Bandit scope above). That tree is Semgrep-clean under
        # p/python + p/security-audit (verified: 0 findings), with any false
        # positives suppressed inline via justified `# nosemgrep` comments; a new
        # real blocking finding there fails the build. Dev/CI tooling, training
        # launchers, benchmark harnesses, generated protobuf, and tests are
        # excluded (accepted dev-script patterns, not shipped risk). Uses the
        # maintained Semgrep CLI from the hash-pinned SAST lock; the legacy
        # returntocorp/semgrep-action is deprecated and was failing on infra,
        # not on a code finding. The rulesets are registry-live, so a future
        # ruleset update can surface a new
        # finding in src/ — triage it (fix or justified nosemgrep), do not silence.
        run: |
          semgrep scan --config p/python --config p/security-audit \
            --error --metrics off src/director_ai/
        env:
          SEMGREP_SEND_METRICS: "off"

  benchmark:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --require-hashes --no-deps -r requirements/ci-dev.txt
          maturin build --release --manifest-path backfire-kernel/crates/backfire-ffi/Cargo.toml --out dist/backfire-kernel
          python -m pip install --force-reinstall --no-deps --no-index dist/backfire-kernel/backfire_kernel-*.whl
          pip install --no-deps -e .

      - name: Run regression benchmarks
        run: python -m benchmarks.regression_suite

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results
          path: benchmarks/results/

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t director-ai:smoke .

      - name: Start container
        run: |
          docker run -d --name dai-smoke -p 8080:8080 \
            -e DIRECTOR_LLM_PROVIDER=mock \
            director-ai:smoke

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/v1/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "Health check timed out"
          docker logs dai-smoke
          exit 1

      - name: Verify endpoints
        run: |
          curl -sf http://localhost:8080/v1/health
          curl -sf http://localhost:8080/v1/source
          curl -sf http://localhost:8080/v1/metrics/prometheus

      - name: Stop container
        if: always()
        run: docker rm -f dai-smoke || true

      - name: Validate GPU Docker builder stage
        run: docker build -f Dockerfile.gpu --target builder -t director-ai:gpu-builder-smoke .

  rust:
    name: Rust (backfire-kernel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backfire-kernel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          workspaces: backfire-kernel

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      # backfire-ffi's default extension-module feature leaves the
      # interpreter symbols to the host Python process, so its unit-test
      # binary must link libpython instead: test it separately with
      # --no-default-features against the system python3-dev.
      - name: Install libpython for ffi unit tests
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Test
        run: |
          cargo test --workspace --exclude backfire-ffi
          cargo test -p backfire-ffi --no-default-features

      # Supply-chain gate (WCG-2): fail on known RustSec vulnerabilities, on any
      # dependency licence outside the permissive allow-list, and on unknown
      # registries/git sources. Policy lives in backfire-kernel/deny.toml. Yanked
      # crates are surfaced as warnings, not failures (see deny.toml rationale).
      - name: Install supply-chain tools
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-audit,cargo-deny

      - name: Audit advisories (RustSec)
        run: cargo audit

      - name: Deny check (advisories, licences, bans, sources)
        run: cargo deny check

  lean:
    name: Lean Proofs (HaltMonitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `sorry`/`admit` close any goal without a proof but only emit a *warning*
      # under `lake build`, so a build could pass with an unproved theorem. Reject
      # them outright before building, so the machine-checked guarantees cannot
      # silently degrade into axioms. The proof-manifest contract test (theorem
      # names ↔ .lean sources) already runs in the `test` job.
      - name: Reject unproved goals (sorry/admit)
        run: |
          if grep -rnE '\b(sorry|admit)\b' formal/HaltMonitor/HaltMonitor/; then
            echo "::error::Unproved goal (sorry/admit) found in Lean sources"
            exit 1
          fi

      # Machine-checks the formally verified halt-monitor kernel. The proofs are
      # core Lean 4 (no Mathlib — lake-manifest packages are empty), so the
      # toolchain is read from formal/HaltMonitor/lean-toolchain and no cache is
      # needed. A type error or failed proof fails the build.
      - name: Build and check Lean proofs
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: formal/HaltMonitor
          build: true
          test: false
          lint: false
          use-mathlib-cache: false

  reuse:
    name: REUSE Compliance (SPDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every tracked file must carry SPDX copyright + licence metadata, via an
      # inline header or a REUSE.toml annotation. Fails the build on any uncovered
      # file so the open-core (Apache-2.0) / media (CC-BY-4.0) / paid-tier
      # (BUSL-1.1) licence boundary stays machine-checkable (WCG-3).
      - name: REUSE lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
        with:
          args: lint

  discord-notify:
    name: Discord CI Notification
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, test-extras, security, fuzz, sast, benchmark, rust, lean]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Resolve overall result
        id: result
        run: |
          RESULTS="${{ needs.lint.result }} ${{ needs.typecheck.result }} ${{ needs.test.result }} ${{ needs.test-extras.result }} ${{ needs.security.result }} ${{ needs.fuzz.result }} ${{ needs.sast.result }} ${{ needs.benchmark.result }} ${{ needs.rust.result }} ${{ needs.lean.result }}"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "passed=false" >> "$GITHUB_OUTPUT"
          else
            echo "passed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST: ${{ needs.test.result }}
          TEST_EXTRAS: ${{ needs.test-extras.result }}
          SECURITY: ${{ needs.security.result }}
          FUZZ: ${{ needs.fuzz.result }}
          SAST: ${{ needs.sast.result }}
          BENCHMARK: ${{ needs.benchmark.result }}
          RUST: ${{ needs.rust.result }}
          LEAN: ${{ needs.lean.result }}

      - name: Build job summary
        id: summary
        run: |
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "⏹️";; skipped) echo "⏭️";; *) echo "❓";; esac; }
          S="$(icon "$LINT") lint  $(icon "$TYPECHECK") typecheck  $(icon "$TEST") test  $(icon "$TEST_EXTRAS") extras  $(icon "$SECURITY") security  $(icon "$FUZZ") fuzz  $(icon "$SAST") sast  $(icon "$BENCHMARK") bench  $(icon "$RUST") rust  $(icon "$LEAN") lean"
          echo "jobs=$S" >> "$GITHUB_OUTPUT"
        env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST: ${{ needs.test.result }}
          TEST_EXTRAS: ${{ needs.test-extras.result }}
          SECURITY: ${{ needs.security.result }}
          FUZZ: ${{ needs.fuzz.result }}
          SAST: ${{ needs.sast.result }}
          BENCHMARK: ${{ needs.benchmark.result }}
          RUST: ${{ needs.rust.result }}
          LEAN: ${{ needs.lean.result }}

      - name: Post to Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ steps.result.outputs.passed }}" = "true" ]; then
            COLOR=3066993  # green
            STATUS="passed"
          else
            COLOR=15158332  # red
            STATUS="FAILED"
          fi
          SHA="${GITHUB_SHA:0:7}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BRANCH="${GITHUB_REF_NAME}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          JOBS="${{ steps.summary.outputs.jobs }}"
          curl -sf -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"CI ${STATUS}\",
              \"color\": ${COLOR},
              \"url\": \"${RUN_URL}\",
              \"fields\": [
                {\"name\": \"Branch\", \"value\": \"\`${BRANCH}\`\", \"inline\": true},
                {\"name\": \"Commit\", \"value\": \"[\`${SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})\", \"inline\": true},
                {\"name\": \"Run\", \"value\": \"[View](${RUN_URL})\", \"inline\": true},
                {\"name\": \"Jobs\", \"value\": \"${JOBS}\", \"inline\": false}
              ],
              \"footer\": {\"text\": \"${GITHUB_REPOSITORY}\", \"icon_url\": \"https://github.com/anulum.png\"},
              \"timestamp\": \"${TIMESTAMP}\"
            }]
          }" "$DISCORD_WEBHOOK_URL"

# Director-Class AI - nightly live red-team workflow

name: Nightly Live Red Team

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      max_cases_per_source:
        description: "Maximum rows loaded from each public data source"
        required: false
        default: "60"
      min_detection_rate:
        description: "Minimum accepted rate across available tiers"
        required: false
        default: "0.0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-red-team:
    name: Current Dataset Red Team
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.21"

      - name: Install test runtime
        run: |
          uv sync --locked --extra embed --extra nli --extra nli-lite --extra dev

      - name: Run live red-team suite
        run: |
          MAX_CASES="${{ github.event.inputs.max_cases_per_source }}"
          MIN_RATE="${{ github.event.inputs.min_detection_rate }}"
          : "${MAX_CASES:=60}"
          : "${MIN_RATE:=0.0}"
          uv run --locked --extra embed --extra nli --extra nli-lite --extra dev \
            python tools/live_red_team.py \
            --output reports/live-red-team/report.json \
            --max-cases-per-source "${MAX_CASES}" \
            --min-detection-rate "${MIN_RATE}" \
            --tiers all

      - name: Run property contract gates
        run: |
          uv run --locked --extra embed --extra nli --extra nli-lite --extra dev \
            pytest \
              tests/test_experimental_namespace.py \
              tests/test_cross_language_contracts.py \
              tests/test_zk_attestation_fuzz.py \
              tests/test_cyber_physical_halt_contract.py

      - name: Upload live red-team report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-red-team-report
          path: reports/live-red-team/report.json

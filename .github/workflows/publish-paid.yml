name: Publish paid tiers (pro + full)

# The BUSL-1.1 paid wheels (director-ai-pro, director-ai-full) are distributed
# through the access-to-artifact gate (decisions D2/D3, 2026-07-16). PRIMARY
# channel: the self-hosted private index at pypi.remanentia.com (pypiserver,
# per-customer basic-auth tokens) — licensed customers install with
#   pip install director-ai-pro \
#     --index-url https://pypi.org/simple/ \
#     --extra-index-url https://<customer>:<token>@pypi.remanentia.com/simple/
# FALLBACK channel: Release assets on a separate private repository.
#
# Operator setup (one-time):
#   - private index: add secret PRIVATE_INDEX_PUBLISHER_TOKEN (the `publisher`
#     htpasswd token from the index box — see CREDENTIALS.md);
#   - fallback repo: set repo variable PAID_DIST_REPO to "<owner>/<dist-repo>"
#     and add secret PAID_DIST_TOKEN (fine-grained PAT, contents:write on the
#     dist repo only).
# Until configured, each upload step is a documented no-op.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v3.18.1)"
        required: true

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish-paid:
    name: Build + publish director-ai-pro and director-ai-full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --require-hashes -r requirements/ci-release.txt

      - name: Build the paid wheels
        run: |
          for tier in pro full; do
            python -m build --wheel "packages/director-ai-$tier" --outdir dist-paid
          done

      - name: Check distributions + namespace safety
        run: |
          twine check dist-paid/*
          # This lane must carry ONLY the paid tiers — the free core publishes
          # from publish.yml to public PyPI, never from here.
          if ls dist-paid/ | grep -Ev '^director_ai_(pro|full)-'; then
            echo "FATAL: non-paid artefact in the paid lane"
            exit 1
          fi
          for tier in pro full; do
            mkdir -p "verify-$tier"
            cp dist-paid/director_ai_${tier}-*.whl "verify-$tier"/
            python scripts/check_paid_wheel.py "verify-$tier" "$tier"
          done

      - name: Publish to the private index (pypi.remanentia.com)
        env:
          TWINE_USERNAME: publisher
          TWINE_PASSWORD: ${{ secrets.PRIVATE_INDEX_PUBLISHER_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PRIVATE_INDEX_PUBLISHER_TOKEN is not set — skipping the"
            echo "private-index upload (index not live yet; see ladder P4)."
            exit 0
          fi
          twine upload --repository-url https://pypi.remanentia.com/ dist-paid/*.whl

      - name: Publish to the private distribution repo
        if: ${{ vars.PAID_DIST_REPO != '' }}
        env:
          GH_TOKEN: ${{ secrets.PAID_DIST_TOKEN }}
        run: |
          # Upload (or replace) the wheels on the tagged release of the private
          # distribution repo. --clobber keeps re-runs idempotent.
          gh release view "$RELEASE_TAG" --repo "${{ vars.PAID_DIST_REPO }}" \
            >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --repo "${{ vars.PAID_DIST_REPO }}" \
                 --title "$RELEASE_TAG" --notes "Director-AI paid tiers $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" dist-paid/*.whl \
            --repo "${{ vars.PAID_DIST_REPO }}" --clobber

      - name: Note when distribution is not configured
        if: ${{ vars.PAID_DIST_REPO == '' }}
        run: |
          echo "PAID_DIST_REPO is not set — built + verified the paid wheels but"
          echo "skipped publishing. Configure PAID_DIST_REPO + PAID_DIST_TOKEN to enable."

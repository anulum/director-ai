# Director-AI — continuous integration
name: CI floor

on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_HTTP_TIMEOUT: "60"
  CARGO_NET_RETRY: "10"

jobs:
  floor:
    name: Pure-Python floor (no rust extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the base floor without the compiled kernel
        # A base `pip install director-ai` resolves the pure-Python floor
        # (ADR-0001). Install the dev/test deps, drop backfire-kernel, and never
        # build it — the kernel is now the opt-in `[rust]` extra, not a base dep.
        run: |
          pip install --require-hashes --no-deps -r requirements/ci-dev.txt
          pip uninstall -y backfire-kernel
          pip install --no-deps -e .

      - name: Assert the compiled kernel is genuinely absent
        run: |
          python - <<'PY'
          import importlib.util
          import sys

          if importlib.util.find_spec("backfire_kernel") is not None:
              sys.exit("backfire_kernel is present; the floor job would not test the floor")
          print("backfire_kernel absent — floor conditions hold")
          PY

      - name: Base install imports and reviews in pure Python
        run: |
          python - <<'PY'
          import director_ai
          from director_ai.core import CoherenceScorer

          assert director_ai.__version__
          approved, score = CoherenceScorer(use_nli=False).review(
              "What is 2+2? Explain.", "The answer is 4 because 2+2=4."
          )
          assert isinstance(approved, bool)
          print(f"floor review OK: approved={approved} score={score.score:.4f}")
          PY

      - name: Run the pure-Python floor test suite
        run: pytest tests/test_rust_fallback_floor.py tests/test_accelerator_fallback_parity.py -v --tb=short

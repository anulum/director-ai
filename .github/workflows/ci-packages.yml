# Director-AI — continuous integration
name: CI packages

on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_HTTP_TIMEOUT: "60"
  CARGO_NET_RETRY: "10"

jobs:
  paid-tiers:
    name: Paid tiers (pro + full) build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --require-hashes --no-deps -r requirements/ci-release.txt

      - name: Build + check the BUSL paid wheels
        run: |
          # Each paid wheel builds from the shared ../../src tree and layers the
          # advanced/labs packages into the director_ai namespace WITHOUT shipping
          # a parent __init__ (so it installs alongside the free Apache core).
          for tier in pro full; do
            python -m build --wheel "packages/director-ai-$tier" --outdir "dist-$tier"
            twine check "dist-$tier"/*
            python scripts/check_paid_wheel.py "dist-$tier" "$tier"
          done

      - name: Build + check the free core wheel
        run: |
          # The free wheel must stay core-only after the D1 re-slice: no paid
          # packages, no paid single modules, and the unpacked wheel must import
          # standalone with the friendly "advanced tier" boundary errors.
          python -m build --wheel . --outdir dist-free
          twine check dist-free/*
          python scripts/check_free_wheel.py dist-free

# Director-AI — continuous integration
name: CI native quality

on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_HTTP_TIMEOUT: "60"
  CARGO_NET_RETRY: "10"

jobs:
  native-quality:
    name: Required native quality profiles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Python quality interpreter and its locked environment
        run: bash tools/install_quality_python.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: packages/vercel-ai/package-lock.json

      - name: Install the locked TypeScript compiler
        working-directory: packages/vercel-ai
        run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache-dependency-path: |
            gateway/go/go.sum
            tools/quality_ratchet_go/go.mod

      - name: Install the qualified Go convention checker
        env:
          GOTOOLCHAIN: local
          GOBIN: ${{ runner.temp }}/director-quality-go
        run: |
          mkdir -p "$GOBIN"
          go install github.com/mgechev/revive@v1.17.0
          test "$("$GOBIN/revive" -version)" = "version 1.17.0"
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Install the qualified Protobuf compiler
        run: |
          if [ "$(/usr/bin/protoc --version 2>/dev/null)" != "libprotoc 3.21.12" ]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends protobuf-compiler
          fi
          test "$(/usr/bin/protoc --version)" = "libprotoc 3.21.12"

      - name: Install the verified rustup and Rust toolchain
        run: bash tools/install_rustup.sh

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/quality_ratchet_rust

      - name: Fetch the locked Rust declaration reader dependencies
        run: cargo fetch --locked --manifest-path tools/quality_ratchet_rust/Cargo.toml

      - name: Install the verified Lean toolchain
        run: bash tools/install_lean.sh

      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13.4"

      - name: Instantiate the locked Julia tuner project
        env:
          JULIA_NUM_PRECOMPILE_TASKS: "2"
        run: |
          julia --startup-file=no --history-file=no --project=tools/quality_ratchet_julia \
            -e 'import Pkg; Pkg.instantiate()'
          git diff --exit-code -- tools/quality_ratchet_julia/Project.toml tools/quality_ratchet_julia/Manifest.toml

      - name: Test native Julia declaration scanning
        env:
          JULIA_LOAD_PATH: "@:@stdlib"
        run: |
          julia --startup-file=no --history-file=no --project=tools/quality_ratchet_julia \
            tools/quality_ratchet_julia/test/runtests.jl
          julia --startup-file=no --history-file=no --project=tools/quality_ratchet_julia \
            tools/quality_ratchet_julia/test/generated.jl

      - name: Walk every pushed commit against its first parent
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          report="$RUNNER_TEMP/director-quality-walk/walk.json"
          mkdir -p "$(dirname "$report")"
          if [ -n "$PR_BASE" ]; then
            range=(--pr-base "$PR_BASE" --to "$PR_HEAD")
          else
            range=(--before "$BEFORE" --to "$GITHUB_SHA")
          fi
          status=0
          "$QUALITY_PYTHON" -m tools.quality_ratchet_walk "${range[@]}" \
            --default-ref origin/main > "$report" || status=$?
          cat "$report"
          exit "$status"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-quality-walk
          path: ${{ runner.temp }}/director-quality-walk/walk.json
          if-no-files-found: warn

      - name: Check all native profiles against the tip's first parent
        env:
          TRUSTED_BASE: ${{ github.event.pull_request.base.sha }}
          GOTOOLCHAIN: local
        run: |
          base="$TRUSTED_BASE"
          if [ -z "$base" ]; then base=$(git rev-parse "$GITHUB_SHA^1"); fi
          since=$("$QUALITY_PYTHON" -c 'import json, sys; print(json.load(open(sys.argv[1]))["start"])' \
            "$RUNNER_TEMP/director-quality-walk/walk.json")
          git cat-file -e "$base^{commit}"
          git cat-file -e "$since^{commit}"
          "$QUALITY_PYTHON" -m tools.check_quality_ratchet --all check \
            --base-ref "$base" --canaries-since "$since" --protoc /usr/bin/protoc --timeout 600

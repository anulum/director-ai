# Director-AI — continuous integration
name: CI lite

on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_HTTP_TIMEOUT: "60"
  CARGO_NET_RETRY: "10"

jobs:
  director-lite:
    name: Director-Lite (standalone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install tools
        # Hash-pinned, matching the rest of CI (ruff/mypy/pytest/pytest-cov live
        # in the dev lock); keeps the Scorecard Pinned-Dependencies check clean.
        run: pip install --require-hashes --no-deps -r requirements/ci-dev.txt

      - name: Ruff format + lint
        run: |
          ruff format --check packages/director-ai-lite/
          ruff check packages/director-ai-lite/

      - name: Type check (strict)
        run: mypy packages/director-ai-lite/src/director_ai_lite --strict

      - name: Tests (100% coverage, standalone)
        run: |
          # The env has only the dev toolchain (no director-ai), so running the
          # suite against the source proves the package is genuinely standalone.
          cd packages/director-ai-lite
          PYTHONPATH=src pytest tests/ -q \
            --cov=director_ai_lite --cov-report=term-missing --cov-fail-under=100

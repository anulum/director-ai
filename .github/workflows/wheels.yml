name: Build & Publish Rust Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheels:
    name: Wheels (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        if: matrix.target == 'aarch64' && runner.os == 'Linux'

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python3.12
          manylinux: auto
          working-directory: backfire-kernel/crates/backfire-ffi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: backfire-kernel/crates/backfire-ffi/dist/

  build-wasm:
    name: WASM Edge Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack@0.13.1 --locked

      - name: Build WASM package
        run: wasm-pack build --target web --release --out-dir pkg
        working-directory: backfire-kernel/crates/backfire-wasm

      - name: Verify output
        run: |
          test -f backfire-kernel/crates/backfire-wasm/pkg/backfire_wasm_bg.wasm
          test -f backfire-kernel/crates/backfire-wasm/pkg/backfire_wasm.js
          ls -lh backfire-kernel/crates/backfire-wasm/pkg/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-edge-runtime
          path: backfire-kernel/crates/backfire-wasm/pkg/

  build-sdist:
    name: Source Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          working-directory: backfire-kernel/crates/backfire-ffi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-sdist
          path: backfire-kernel/crates/backfire-ffi/dist/

  publish:
    name: Publish backfire-kernel
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    # Publish on a real release, or on manual dispatch (a release created by
    # release.yml via GITHUB_TOKEN does not re-trigger this workflow, so a tag
    # alone never publishes the wheels — dispatch is the supported path). The
    # "already published" guard below keeps a re-run idempotent.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Check if version already published
        id: check
        run: |
          VERSION=$(ls dist/*.tar.gz | head -1 | sed 's/.*-\(.*\)\.tar\.gz/\1/')
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/backfire-kernel/${VERSION}/json")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "exists=$( [ "$STATUS" = "200" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        if: steps.check.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

name: Deploy Docs

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "Makefile"
      - "backfire-kernel/**"
      - "docs-site/**"
      - "formal/HaltMonitor/**"
      - "gateway/go/**"
      - "mkdocs.yml"
      - "notebooks/**"
      - "packages/vercel-ai/**"
      - "proto/**"
      - "requirements/ci-docs.txt"
      - "schemas/proto/**"
      - "src/director_ai/**"
      - "tools/build_go_docs.py"
      - "tools/julia_tuner/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "Makefile"
      - "backfire-kernel/**"
      - "docs-site/**"
      - "formal/HaltMonitor/**"
      - "gateway/go/**"
      - "mkdocs.yml"
      - "notebooks/**"
      - "packages/vercel-ai/**"
      - "proto/**"
      - "requirements/ci-docs.txt"
      - "schemas/proto/**"
      - "src/director_ai/**"
      - "tools/build_go_docs.py"
      - "tools/julia_tuner/**"

permissions: read-all

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustdoc:
    name: Build Rust API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backfire-kernel

      - name: Build warning-fatal rustdoc
        run: make docs-rust

      - name: Upload Rust API
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-rust
          path: backfire-kernel/target/doc
          if-no-files-found: error

  go-doc:
    name: Build Go API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go/go.mod
          cache-dependency-path: gateway/go/go.sum

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Build Go package reference
        run: make docs-go

      - name: Upload Go API
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-go
          path: build/generated-docs/go
          if-no-files-found: error

  typedoc:
    name: Build TypeScript API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/vercel-ai/package-lock.json

      - name: Build warning-fatal TypeDoc reference
        run: make docs-typescript

      - name: Upload TypeScript API
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-typescript
          path: build/generated-docs/typescript
          if-no-files-found: error

  julia-doc:
    name: Build Julia API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.10"

      - name: Build warning-fatal Documenter reference
        run: make docs-julia

      - name: Upload Julia API
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-julia
          path: build/generated-docs/julia
          if-no-files-found: error

  lean-doc:
    name: Build Lean API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean toolchain and dependencies
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: formal/HaltMonitor/docbuild
          build: false
          test: false
          lint: false
          use-mathlib-cache: false

      - name: Build doc-gen4 reference
        run: make docs-lean

      - name: Upload Lean API
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-lean
          path: formal/HaltMonitor/docbuild/.lake/build/doc
          if-no-files-found: error

  protobuf-doc:
    name: Build Protobuf API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"

      - name: Install Protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends protobuf-compiler
          test "$(protoc --version)" = "libprotoc 3.21.12"

      - name: Build Protobuf reference
        run: make docs-protobuf

      - name: Upload Protobuf API
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-protobuf
          path: build/generated-docs/protobuf
          if-no-files-found: error

  build:
    name: Assemble MkDocs and generated APIs
    needs: [go-doc, julia-doc, lean-doc, protobuf-doc, rustdoc, typedoc]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --require-hashes --no-deps -r requirements/ci-docs.txt
          pip install --no-deps -e .

      - name: Build strict MkDocs site
        run: mkdocs build --strict

      - name: Download Rust API
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-rust
          path: site/reference/rust

      - name: Download Go API
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-go
          path: site/reference/go

      - name: Download TypeScript API
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-typescript
          path: site/reference/typescript

      - name: Download Julia API
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-julia
          path: site/reference/julia

      - name: Download Lean API
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-lean
          path: site/reference/lean

      - name: Download Protobuf API
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-protobuf
          path: site/reference/protobuf

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

# Director-AI — native API documentation workflow
name: Deploy Docs

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "Makefile"
      - "backfire-kernel/**"
      - "docs-site/**"
      - "formal/HaltMonitor/**"
      - "gateway/go/**"
      - "mkdocs.yml"
      - "notebooks/**"
      - "packages/vercel-ai/**"
      - "proto/**"
      - "requirements/ci-docs.txt"
      - "schemas/proto/**"
      - "src/director_ai/**"
      - "tools/build_go_docs.py"
      - "tools/install_lean.sh"
      - "tools/julia_tuner/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "Makefile"
      - "backfire-kernel/**"
      - "docs-site/**"
      - "formal/HaltMonitor/**"
      - "gateway/go/**"
      - "mkdocs.yml"
      - "notebooks/**"
      - "packages/vercel-ai/**"
      - "proto/**"
      - "requirements/ci-docs.txt"
      - "schemas/proto/**"
      - "src/director_ai/**"
      - "tools/build_go_docs.py"
      - "tools/install_lean.sh"
      - "tools/julia_tuner/**"

permissions: read-all

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustdoc:
    name: Build Rust API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backfire-kernel

      - name: Build warning-fatal rustdoc
        run: make docs-rust

      - name: Upload Rust API
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-rust
          path: backfire-kernel/target/doc
          if-no-files-found: error

  go-doc:
    name: Build Go API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache-dependency-path: gateway/go/go.sum

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build Go package reference
        run: make docs-go

      - name: Upload Go API
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-go
          path: build/generated-docs/go
          if-no-files-found: error

  typedoc:
    name: Build TypeScript API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.10.0"
          cache: npm
          cache-dependency-path: packages/vercel-ai/package-lock.json

      - name: Build warning-fatal TypeDoc reference
        run: make docs-typescript

      - name: Upload TypeScript API
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-typescript
          path: build/generated-docs/typescript
          if-no-files-found: error

  julia-doc:
    name: Build Julia API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.10"

      - name: Build warning-fatal Documenter reference
        run: make docs-julia

      - name: Upload Julia API
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-julia
          path: build/generated-docs/julia
          if-no-files-found: error

  lean-doc:
    name: Build Lean API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install verified Lean toolchain
        run: bash tools/install_lean.sh

      - name: Build doc-gen4 reference
        run: make docs-lean

      - name: Upload Lean API
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-lean
          path: formal/HaltMonitor/docbuild/.lake/build/doc
          if-no-files-found: error

  protobuf-doc:
    name: Build Protobuf API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"

      - name: Install Protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends protobuf-compiler
          test "$(protoc --version)" = "libprotoc 3.21.12"

      - name: Build Protobuf reference
        run: make docs-protobuf

      - name: Upload Protobuf API
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-protobuf
          path: build/generated-docs/protobuf
          if-no-files-found: error

  build:
    name: Assemble MkDocs and generated APIs
    needs: [go-doc, julia-doc, lean-doc, protobuf-doc, rustdoc, typedoc]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --require-hashes --no-deps -r requirements/ci-docs.txt
          pip install --no-deps -e .

      - name: Build strict MkDocs site
        run: mkdocs build --strict

      - name: Download Rust API
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-rust
          path: site/reference/rust

      - name: Download Go API
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-go
          path: site/reference/go

      - name: Download TypeScript API
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-typescript
          path: site/reference/typescript

      - name: Download Julia API
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-julia
          path: site/reference/julia

      - name: Download Lean API
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-lean
          path: site/reference/lean

      - name: Download Protobuf API
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-protobuf
          path: site/reference/protobuf

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

# Director-AI — continuous integration
name: CI python

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_HTTP_TIMEOUT: "60"
  CARGO_NET_RETRY: "10"

jobs:
  test-partitions:
    name: Test partition ${{ matrix.partition }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        partition: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache-dependency-path: |
            gateway/go/go.sum
            tools/quality_ratchet_go/go.mod

      - name: Install the qualified native Go convention checker
        env:
          GOTOOLCHAIN: local
          GOBIN: ${{ runner.temp }}/director-native-tools
        run: |
          mkdir -p "$GOBIN"
          go install github.com/mgechev/revive@v1.17.0
          test "$("$GOBIN/revive" -version)" = "version 1.17.0"
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          pip install --require-hashes --no-deps -r requirements/ci-dev.txt
          pip install --require-hashes --no-deps -r requirements/ci-inference.txt
          maturin build --release --manifest-path backfire-kernel/crates/backfire-ffi/Cargo.toml --out dist/backfire-kernel
          python -m pip install --force-reinstall --no-deps --no-index dist/backfire-kernel/backfire_kernel-*.whl
          pip install --no-deps -e .


      - name: Run the complete assigned test partition
        env:
          PARTITION_INDEX: ${{ matrix.partition }}
        run: |
          coverage run --parallel-mode --source=director_ai -m pytest tests/ -v --tb=short \
            -p tools.pytest_partition --partition-index "$PARTITION_INDEX" \
            --partition-report partition.json --partition-revision "$GITHUB_SHA"

      - name: Upload native test and coverage evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-partition-${{ matrix.python-version }}-${{ matrix.partition }}
          path: |
            partition.json
            .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  go-quality-parser:
    name: Native Go documentation command
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache-dependency-path: tools/quality_ratchet_go/go.mod

      - name: Qualify the actual compiled native command
        working-directory: tools/quality_ratchet_go
        env:
          GOTOOLCHAIN: local
          DIRECTOR_QUALITY_GO_COVERDIR: ${{ runner.temp }}/go-command-coverage
        run: |
          test -z "$(gofmt -l .)"
          go vet .
          mkdir -p "$DIRECTOR_QUALITY_GO_COVERDIR"
          go test -count=1 -timeout=120s .
          go tool covdata textfmt -i="$DIRECTOR_QUALITY_GO_COVERDIR" -o=go-command-statements.out
          go tool cover -func=go-command-statements.out
          awk 'NR > 1 { statements += $2; if ($2 > 0 && $3 == 0) missing = 1 } END { exit missing || statements == 0 }' go-command-statements.out
          go doc -all -u . > go-command-reference.txt

      - name: Upload original native command evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-documentation-command
          path: |
            tools/quality_ratchet_go/go-command-statements.out
            tools/quality_ratchet_go/go-command-reference.txt
          if-no-files-found: error

  test:
    name: Complete tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [test-partitions, go-quality-parser]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install aggregation and coverage tools
        run: |
          pip install --require-hashes --no-deps -r requirements/ci-dev.txt
          pip install --no-deps -e .

      - name: Download all native partitions for this Python lane
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-partition-${{ matrix.python-version }}-*
          path: test-partitions

      - name: Verify every native case and original model review
        env:
          PYTHON_LANE: ${{ matrix.python-version }}
        run: |
          python -m tools.aggregate_test_partitions --input test-partitions \
            --revision "$GITHUB_SHA" --python-version "$PYTHON_LANE" --output complete-tests.json

      - name: Combine all coverage and enforce the unchanged floor
        run: |
          coverage combine --keep test-partitions/*
          coverage report --fail-under=97
          coverage xml --fail-under=97

      - name: Verify pure-Python import
        if: matrix.python-version == '3.12'
        run: python -c "import director_ai; assert director_ai.__version__"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml


      - name: Upload complete native test receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: complete-tests-${{ matrix.python-version }}
          path: complete-tests.json
          if-no-files-found: error

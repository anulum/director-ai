# Director-Class AI — Cargo
[package]
name = "backfire-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Director-Class AI Backfire Kernel — PyO3 Python bindings"

[lib]
name = "backfire_kernel"
crate-type = ["cdylib"]

[dependencies]
backfire-types = { path = "../backfire-types" }
backfire-core = { path = "../backfire-core" }
backfire-physics = { path = "../backfire-physics" }
backfire-observers = { path = "../backfire-observers" }
backfire-ssgf = { path = "../backfire-ssgf" }
pyo3 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
bulletproofs = "5.0"
curve25519-dalek = "4.1"
merlin = "3"
rand = "0.8"

[features]
# Default for maturin wheel builds. Unit tests run with
# --no-default-features so the test binary links libpython instead of
# leaving the interpreter symbols to the host process.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[lints]
workspace = true

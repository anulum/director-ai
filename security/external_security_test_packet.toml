# Director-Class AI - external security test packet

schema_version = "1.0.0"
packet_id = "director-ai-security-test-2026-04"
packet_doc = "security/EXTERNAL_SECURITY_TEST_PACKET.md"
runbook_doc = "security/EXTERNAL_SECURITY_TEST_RUNBOOK.md"
evidence_validator = "tools/validate_external_security_run.py"
policy_doc = "SECURITY.md"
contact = "director.class.ai@anulum.li"
run_status = "not_run"

[acceptance]
minimum_tracks = 6
require_environment_fingerprint = true
require_raw_http_transcripts = true
require_non_empty_http_transcripts = true
require_websocket_frame_log = true
require_tenant_matrix = true
require_two_tenant_isolation_matrix = true
require_ingestion_matrix = true
require_physical_matrix = true
require_attestation_matrix = true
require_contract_matrix = true
require_redaction_review = true
require_evidence_path_confinement = true
require_summary_commit_match = true

[[test_tracks]]
id = "streaming_interception"
purpose = "Exercise streamed response oversight, WebSocket auth failure paths, tenant mismatch handling, halt frames, and cancellation frames."
surfaces = ["/v1/stream", "StreamingKernel", "AsyncStreamingKernel"]
source_files = [
  "src/director_ai/server.py",
  "src/director_ai/core/runtime/streaming.py",
  "src/director_ai/core/async_streaming.py",
]
existing_regression_tests = [
  "tests/test_server_ws_mux.py",
  "tests/test_cov_server_deep.py",
  "tests/test_coverage_streaming.py",
  "tests/test_async_streaming.py",
]
required_checks = [
  "WebSocket without a valid key closes before accepting application frames when keys are configured.",
  "Tenant mismatch closes with a policy code when key-to-tenant binding is configured.",
  "Streaming oversight emits a halt frame when coherence falls below the hard limit.",
  "Concurrent sessions cannot leak frames across session ids.",
  "Cancellation stops a session without emitting later result frames.",
]
required_evidence = [
  "websocket_handshake_matrix",
  "frame_log",
  "halt_event_sample",
  "cancellation_sample",
]

[[test_tracks]]
id = "multi_tenant_isolation"
purpose = "Exercise tenant-bound routing, fact writes, vector fact writes, list visibility, REST review calls, gRPC metadata routing, and audit tenant fields."
surfaces = [
  "/v1/tenants",
  "/v1/tenants/{tenant_id}/facts",
  "/v1/tenants/{tenant_id}/vector-facts",
  "grpc metadata x-tenant-id",
]
source_files = [
  "src/director_ai/server.py",
  "src/director_ai/grpc_server.py",
  "src/director_ai/core/tenant.py",
  "src/director_ai/core/retrieval/knowledge.py",
]
existing_regression_tests = [
  "tests/test_server_tenant.py",
  "tests/test_server_ws_mux.py",
  "tests/test_enterprise_modules.py",
  "tests/test_audit.py",
]
required_checks = [
  "Tenant A cannot list tenant B documents or facts through bound REST keys.",
  "Tenant A cannot write tenant B facts through bound REST keys.",
  "Vector stores are distinct per tenant and backend type.",
  "gRPC tenant metadata does not override key-to-tenant binding.",
  "Audit rows carry tenant id without raw prompt text.",
]
required_evidence = [
  "tenant_access_matrix",
  "cross_tenant_write_attempts",
  "vector_store_partition_sample",
  "audit_redaction_sample",
]

[[test_tracks]]
id = "knowledge_ingestion"
purpose = "Exercise text and file ingestion, document metadata boundaries, retrieval scoping, update/delete paths, size limits, content-type checks, and source sanitisation."
surfaces = [
  "/v1/knowledge/ingest",
  "/v1/knowledge/upload",
  "/v1/knowledge/documents",
  "/v1/knowledge/search",
]
source_files = [
  "src/director_ai/knowledge_api.py",
  "src/director_ai/core/retrieval/doc_registry.py",
  "src/director_ai/core/retrieval/ingestion/base.py",
  "src/director_ai/core/retrieval/doc_parser.py",
]
existing_regression_tests = [
  "tests/test_coverage_knowledge_api.py",
  "tests/test_knowledge_edge_cases.py",
  "tests/test_cli_ingest_formats.py",
]
required_checks = [
  "Invalid tenant ids, document ids, sources, file types, and content length values are rejected.",
  "Tenant A search does not return tenant B chunks.",
  "Document replacement removes stale chunks before writing replacements.",
  "Delete removes document metadata and all reachable chunks.",
  "Ingestion metadata does not store credentials from plugin clients.",
]
required_evidence = [
  "ingestion_rejection_matrix",
  "tenant_scoped_search_sample",
  "update_delete_trace",
  "metadata_redaction_sample",
]

[[test_tracks]]
id = "physical_hooks"
purpose = "Exercise cyber-physical hook decisions, physical budget exhaustion, warn-only defaults, blocking deployment flags, and malformed physical action payloads."
surfaces = [
  "CoherenceAgent.verify_physical_action",
  "GroundingHook.evaluate",
  "TenantPhysicalBudget",
  "cyber_physical adapters",
]
source_files = [
  "src/director_ai/core/agent.py",
  "src/director_ai/core/cyber_physical/hook.py",
  "src/director_ai/core/cyber_physical/budget.py",
  "src/director_ai/core/cyber_physical/adapters.py",
]
existing_regression_tests = [
  "tests/test_agent_safety_hooks.py",
  "tests/test_cyber_physical.py",
  "tests/test_cyber_physical_halt_contract.py",
  "tests/test_physical_budget.py",
]
required_checks = [
  "Physical constraint failures remain advisory unless the explicit blocking flag is enabled.",
  "Budget exhaustion blocks in default advisory mode before solver or simulator calls execute.",
  "Malformed action payloads are rejected without invoking adapter code.",
  "Missing ROS 2, MuJoCo, or CARLA runtimes fail closed with documented install guidance.",
  "Concurrent physical checks do not leak halt state across tenants or sessions.",
]
required_evidence = [
  "physical_action_matrix",
  "budget_exhaustion_trace",
  "adapter_failure_sample",
  "concurrent_physical_sample",
]

[[test_tracks]]
id = "attestation"
purpose = "Exercise Merkle commitments, cross-organisation passports, issuer allowlists, tamper rejection, replay handling, and missing proof backend paths."
surfaces = [
  "MerkleCommitment",
  "CommitmentBackend",
  "PassportIssuer",
  "PassportVerifier",
  "CoherenceAgent.verify_passport",
]
source_files = [
  "src/director_ai/core/zk_attestation/commitment.py",
  "src/director_ai/core/zk_attestation/backends.py",
  "src/director_ai/core/zk_attestation/passport.py",
  "src/director_ai/core/agent.py",
]
existing_regression_tests = [
  "tests/test_zk_attestation.py",
  "tests/test_agent_safety_hooks.py",
]
required_checks = [
  "Merkle openings reject wrong keys, swapped leaves, and aggregate inflation.",
  "Passport verification rejects unknown issuers and altered message authentication codes.",
  "Missing attestation backends produce explicit failure reasons instead of trusted fallback decisions.",
  "Verifier output never exposes raw samples beyond the opened evidence set.",
  "Cross-organisation hand-off evidence includes issuer, subject, statement, and tested backend.",
]
required_evidence = [
  "attestation_matrix",
  "tamper_rejection_sample",
  "passport_verdict_sample",
  "opened_evidence_redaction_sample",
]

[[test_tracks]]
id = "cross_language_trust_boundary"
purpose = "Exercise Python, Rust, Go, and protobuf boundaries for schema drift, unknown enum values, score clamping, deterministic serialisation, and safety event parity."
surfaces = [
  "director.v1 protobuf",
  "Python proto converters",
  "Go gateway proto bindings",
  "Rust kernel FFI",
]
source_files = [
  "schemas/proto/director/v1/director.proto",
  "src/director_ai/proto/converters.py",
  "gateway/go/proto/director/v1/director.pb.go",
  "backfire-kernel/crates/backfire-ffi/src/safety_hooks.rs",
]
existing_regression_tests = [
  "tests/test_cross_language_contracts.py",
  "tests/test_proto_roundtrip.py",
  "tests/test_rust_parity_safety.py",
]
required_checks = [
  "Python and Go protobuf bindings round-trip verdicts and safety events with deterministic bytes.",
  "Rust FFI rejects non-finite scores and preserves unit-interval clamp semantics.",
  "Unknown or future enum values degrade to explicit policy failures instead of silent allow decisions.",
  "Tenant ids and request ids survive Python, proto, and Go gateway boundaries.",
  "Boundary tests include malformed payloads and oversized attribute maps.",
]
required_evidence = [
  "contract_matrix",
  "proto_roundtrip_sample",
  "rust_ffi_rejection_sample",
  "go_gateway_boundary_sample",
]

[[required_outputs]]
path = "security-validation/environment.json"
description = "Runtime, package, server config, and enabled optional extras fingerprint."

[[required_outputs]]
path = "security-validation/http_transcripts/"
description = "HTTP requests and responses with credentials redacted."

[[required_outputs]]
path = "security-validation/websocket_frames.jsonl"
description = "Ordered WebSocket frames for accepted, rejected, halted, and cancelled streams."

[[required_outputs]]
path = "security-validation/tenant_matrix.csv"
description = "Tenant A/B read, write, list, stream, and gRPC access matrix."

[[required_outputs]]
path = "security-validation/ingestion_matrix.csv"
description = "Accepted and rejected ingestion payload cases."

[[required_outputs]]
path = "security-validation/physical_matrix.csv"
description = "Physical action, budget, adapter, and tenant-isolation cases."

[[required_outputs]]
path = "security-validation/attestation_matrix.csv"
description = "Merkle opening, passport, issuer, and backend cases."

[[required_outputs]]
path = "security-validation/contract_matrix.csv"
description = "Python, Rust, Go, and protobuf boundary cases."

[[required_outputs]]
path = "security-validation/findings.jsonl"
description = "One finding per line with severity, surface, reproduction, and evidence path."

[[required_outputs]]
path = "security-validation/summary.md"
description = "Pass/fail summary for each track, residual risk, and recommended fixes."

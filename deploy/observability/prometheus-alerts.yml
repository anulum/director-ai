# Director-Class AI — Prometheus Alert Rules

groups:
  - name: director-ai
    rules:
      - alert: HighRejectionRate
        expr: |
          sum by (job, instance) (rate(director_ai_reviews_rejected[5m]))
          /
          clamp_min(sum by (job, instance) (rate(director_ai_reviews_total[5m])), 0.001) > 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Review rejection rate > 15% for 5 minutes"
          description: "Instance {{ $labels.instance }} is rejecting {{ $value | humanizePercentage }} of reviewed responses."

      - alert: ReviewLatencyHigh
        expr: |
          histogram_quantile(0.95, rate(director_ai_review_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Review p95 latency > 500ms"
          description: "Instance {{ $labels.instance }} p95 latency is {{ $value | humanizeDuration }}."

      - alert: HaltSpike
        expr: sum by (job, instance) (rate(director_ai_halts_total[5m])) * 60 > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Halt rate > 10/min"
          description: "Instance {{ $labels.instance }} is emitting {{ $value | humanize }} halt events per minute."

      - alert: RetuneRecommended
        expr: director_ai_retune_recommended > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Retune pass recommended"
          description: "Recent feedback or calibration telemetry recommends a retune pass on {{ $labels.instance }}."

      - alert: ErrorRateHigh
        expr: |
          sum by (job, instance) (rate(director_ai_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum by (job, instance) (rate(director_ai_http_requests_total[5m])), 0.001) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx rate > 1%"
          description: "Instance {{ $labels.instance }} is returning {{ $value | humanizePercentage }} 5xx responses."

      - alert: StaleKnowledgeSources
        expr: director_ai_kb_stale_sources > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Stale knowledge sources detected"
          description: "Refresh or retract stale knowledge sources before relaxing halt thresholds on {{ $labels.instance }}."

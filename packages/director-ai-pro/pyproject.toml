# Director-Class AI — director-ai-pro package metadata

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "director-ai-pro"
version = "3.16.1"
description = "Advanced commercial tier for Director-AI — compliance, enterprise, streaming repair, multimodal, routing and more (BUSL-1.1)"
authors = [
    {name = "Miroslav Šotek", email = "protoscience@anulum.li"}
]
license = "BUSL-1.1"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "llm",
    "hallucination",
    "guardrail",
    "director-ai",
    "advanced",
    "compliance",
    "enterprise",
    "streaming-repair",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The advanced/labs modules build on the free Apache-2.0 core. Installing this
# tier pulls the core and layers the BUSL-1.1 packages into the same
# ``director_ai`` namespace (no parent __init__ is shipped here).
dependencies = [
    "director-ai>=3.16.1,<4",
]

[project.urls]
Homepage = "https://www.anulum.li"
Repository = "https://github.com/anulum/director-ai"
Issues = "https://github.com/anulum/director-ai/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["../../src"]
include = [
    "director_ai.agentic*",
    "director_ai.compliance*",
    "director_ai.enterprise*",
    "director_ai.ui*",
    "director_ai.voice*",
    "director_ai.core.agent_identity*",
    "director_ai.core.citation_grounding*",
    "director_ai.core.customer_model_factory*",
    "director_ai.core.dp_rag*",
    "director_ai.core.execution_rings*",
    "director_ai.core.federated_dp*",
    "director_ai.core.financial_services*",
    "director_ai.core.fuzzing*",
    "director_ai.core.interpretability*",
    "director_ai.core.meta_guard*",
    "director_ai.core.ml_bom*",
    "director_ai.core.multimodal_guard*",
    "director_ai.core.output_integrity*",
    "director_ai.core.output_trust*",
    "director_ai.core.rasp*",
    "director_ai.core.routing*",
    "director_ai.core.self_healing*",
    "director_ai.core.streaming_repair*",
    "director_ai.core.sustainability*",
    "director_ai.core.temporal_consistency*",
    "director_ai.core.threat_intel*",
]

# Director-Class AI - public benchmark manifest

schema_version = "1.0.0"

[cache_schema]
path = "benchmarks/CACHE_SCHEMA.md"
result_schema = "benchmarks/results/SCHEMA.md"

[external_validation]
packet = "benchmarks/EXTERNAL_VALIDATION_PACKET.md"
manifest = "benchmarks/external_validation_packet.toml"

[[benchmark_mode_cards]]
id = "heuristic_streaming_false_halt"
mode_family = "heuristic"
claim_scope = "Streaming false-halt rate plus labelled bad-passage halt diagnostics"
public_metric = "4.4% false-halt rate; 33.3% heuristic halt recall on labelled smoke set"
public_tables = ["readme_scoring_pyramid", "benchmark_report_streaming_false_halt"]
datasets = ["streaming_good_passages", "streaming_bad_passages"]
runner_files = ["benchmarks/streaming_false_halt_bench.py"]
commands = ["python -m benchmarks.streaming_false_halt_bench"]
result_files = ["benchmarks/results/streaming_false_halt_heuristic.json"]
metrics = ["false_halt_rate", "halt_precision", "halt_recall", "token_of_halt_accuracy", "avg_coherence", "avg_latency_ms"]
claim_boundary = "False-halt rate and synthetic bad-passage halt diagnostics only; do not present as a customer-domain hallucination catch rate."

[[benchmark_mode_cards]]
id = "pure_nli_aggrefact_global"
mode_family = "pure_nli"
claim_scope = "Global-threshold FactCG factual-consistency scoring"
public_metric = "75.8% per-dataset mean balanced accuracy at threshold 0.46"
public_tables = ["readme_aggrefact_leaderboard"]
datasets = ["llm_aggrefact"]
runner_files = ["benchmarks/aggrefact_eval.py"]
commands = [
  "python -m benchmarks.aggrefact_eval --model yaxili96/FactCG-DeBERTa-v3-Large --threshold 0.46",
]
result_files = ["benchmarks/results/aggrefact_yaxili96_FactCG-DeBERTa-v3-Large.json"]
metrics = ["avg_balanced_accuracy_pct", "threshold", "latency_ms_avg"]
claim_boundary = "Global-threshold NLI; do not compare directly with tuned-threshold or judge-assisted catch-rate rows. The public LLM-AggreFact leaderboard uses threshold 0.50, giving 75.6% on the same per-dataset-mean metric."

[[benchmark_mode_cards]]
id = "tuned_threshold_aggrefact"
mode_family = "tuned_threshold_nli"
claim_scope = "Per-dataset threshold replay on cached FactCG scores"
public_metric = "77.76% per-dataset mean balanced accuracy"
public_tables = ["readme_aggrefact_leaderboard"]
datasets = ["llm_aggrefact"]
runner_files = ["benchmarks/aggrefact_eval.py"]
commands = [
  "python -m benchmarks.aggrefact_eval --load-scores benchmarks/results/aggrefact_yaxili96_FactCG-DeBERTa-v3-Large.json --sweep",
]
result_files = [
  "benchmarks/results/aggrefact_yaxili96_FactCG-DeBERTa-v3-Large.json",
  "benchmarks/results/aggrefact_sweep_lr_low.json",
]
metrics = ["per_dataset_thresholds", "per_dataset_mean_balanced_accuracy"]
claim_boundary = "Threshold-tuned replay; do not describe as model retraining or default runtime behaviour."

[[benchmark_mode_cards]]
id = "pure_nli_halueval_e2e"
mode_family = "pure_nli"
claim_scope = "End-to-end NLI guardrail scoring on HaluEval traces"
public_metric = "46.7% catch rate with 56.9% precision on 300 traces"
public_tables = ["benchmark_report_e2e_halueval"]
datasets = ["halueval"]
runner_files = ["benchmarks/e2e_eval.py"]
commands = [
  "python -m benchmarks.e2e_eval --nli --max-samples 100 --threshold 0.35 --soft-limit 0.45 --output-json benchmarks/results/e2e_guardrail.json",
]
result_files = ["benchmarks/results/e2e_guardrail.json"]
metrics = ["catch_rate", "false_positive_rate", "precision", "f1", "avg_latency_ms"]
claim_boundary = "Pure end-to-end NLI guardrail mode; not an AggreFact leaderboard claim and not judge-assisted."

[[benchmark_mode_cards]]
id = "hybrid_remote_judge_halueval"
mode_family = "hybrid_judge"
claim_scope = "NLI plus remote judge on HaluEval traces"
public_metric = "90.7% catch rate with 64.0% FPR on 600 traces"
public_tables = ["benchmark_report_e2e_halueval"]
datasets = ["halueval"]
runner_files = ["benchmarks/e2e_eval.py"]
commands = [
  "python -m benchmarks.e2e_eval --nli --scorer-backend hybrid --llm-judge-provider <provider> --llm-judge-model <model>",
]
result_files = []
metrics = ["catch_rate", "false_positive_rate", "precision", "f1", "avg_latency"]
claim_boundary = "Judge-assisted mode; never merge this catch-rate claim into pure NLI or heuristic cards."

[[benchmark_mode_cards]]
id = "local_judge_halueval"
mode_family = "local_judge"
claim_scope = "NLI plus local borderline-case classifier on HaluEval traces"
public_metric = "33.8% catch at 3.7% FPR and 90.2% precision on 1200 HaluEval traces (200/task, threshold 0.5); QA subset 84.5% catch at 95.5% precision"
public_tables = ["benchmark_report_local_judge"]
datasets = ["halueval"]
runner_files = ["benchmarks/run_judge_benchmark.py"]
commands = ["python benchmarks/run_judge_benchmark.py --samples 200"]
result_files = [
  "benchmarks/results/judge_bench_summary_200.json",
  "benchmarks/results/judge_bench_local_judge_200.json",
]
metrics = ["catch_rate", "false_positive_rate", "precision", "f1"]
claim_boundary = "Local judge mode; report separately from remote-judge and pure-NLI rows. Conservative operating point (threshold 0.5): high precision and low FPR, aggregate catch dominated by the QA task while summarisation/dialogue stay low. An earlier untracked 1000/task L40S run reported 93.8% catch at 66.3% FPR; that aggregate over-flagged summarisation/dialogue (~98% FPR on those tasks) and does not reproduce on the current pipeline (33.8% catch at 3.7% FPR at the same threshold), so it is not claimed."

[[benchmark_mode_cards]]
id = "hallubench_geospatial_internal"
mode_family = "multimodal_geospatial"
claim_scope = "Gated HalluBench geospatial VLM answer agreement"
public_metric = "No public score yet; runner prepared for gated internal validation"
public_tables = ["benchmark_report_hallubench_internal"]
datasets = ["hallubench"]
runner_files = ["benchmarks/hallubench_eval.py"]
commands = [
  "HF_TOKEN=<accepted-access-token> python -m benchmarks.hallubench_eval --predictions-jsonl validation/hallubench_predictions.jsonl --output-json benchmarks/results/hallubench_internal_validation.json",
]
result_files = ["benchmarks/results/hallubench_internal_validation.json"]
metrics = ["accuracy", "exact_match_rate", "numeric_match_rate", "mean_token_f1", "missing_predictions"]
claim_boundary = "Prepared internal validation harness only; do not publish a HalluBench score until gated access, model provenance, and metric review are recorded."

[[benchmark_mode_cards]]
id = "pure_nli_ragtruth_freshqa"
mode_family = "pure_nli"
claim_scope = "Open weak lanes: NLI-only RAGTruth response grounding and FreshQA false-premise flagging"
public_metric = "RAGTruth: 49.3% catch at 40.9% FPR, 43.7% F1 on 2,700 samples. FreshQA: 98.6% catch at 97.8% FPR on 600 samples (context-free flagging)"
public_tables = ["benchmark_report_ragtruth_freshqa"]
datasets = ["ragtruth", "freshqa"]
runner_files = ["benchmarks/run_ragtruth_freshqa.py", "benchmarks/ragtruth_eval.py", "benchmarks/freshqa_eval.py"]
commands = ["python benchmarks/run_ragtruth_freshqa.py"]
result_files = [
  "benchmarks/results/ragtruth_nli_results.json",
  "benchmarks/results/freshqa_nli_results.json",
]
metrics = ["catch_rate", "false_positive_rate", "precision", "f1", "avg_latency_ms"]
claim_boundary = "Open accuracy lanes, not product claims: RAGTruth NLI-only performance is weak (README caveat) and the FreshQA catch rate is inseparable from its near-total FPR, so neither catch rate may be quoted without its FPR or presented as a customer-domain hallucination catch rate."

[[benchmark_mode_cards]]
id = "pure_nli_fever_prepared"
mode_family = "pure_nli"
claim_scope = "Held-out FEVER dev fact-verification runner (prepared only)"
public_metric = "No public score; no committed result artefact exists for this runner"
public_tables = ["docs_site_benchmark_runner_matrix"]
datasets = ["fever_nli"]
runner_files = ["benchmarks/fever_eval.py"]
commands = ["python -m benchmarks.fever_eval 500"]
result_files = []
metrics = ["accuracy", "f1"]
claim_boundary = "No FEVER accuracy claim may be published until a result artefact is committed and reviewed; the docs-site row lists the runner only. FEVER train is part of the borderline-classifier training mix, so any future dev-split claim must state that provenance."

[[datasets]]
id = "llm_aggrefact"
name = "LLM-AggreFact"
source = "lytang/LLM-AggreFact"
split = "test"
access = "gated; requires HF_TOKEN or prior local dataset login"
local_cache = []
size_note = "29,320 labelled examples across 11 subsets in the full test split"
label_fields = ["doc", "claim", "label", "dataset"]

[[datasets]]
id = "halueval"
name = "HaluEval"
source = "pminervini/HaluEval"
split = "qa, summarization, dialogue task files"
access = "public parquet downloads"
local_cache = [
  "benchmarks/.cache/halueval_qa.parquet",
  "benchmarks/.cache/halueval_summarization.parquet",
  "benchmarks/.cache/halueval_dialogue.parquet",
]
size_note = "paired right/hallucinated responses per task"
label_fields = ["right_*", "hallucinated_*"]

[[datasets]]
id = "truthfulqa"
name = "TruthfulQA"
source = "TruthfulQA.csv cache"
split = "local cache"
access = "public CSV mirrored into benchmark cache"
local_cache = ["benchmarks/.cache/TruthfulQA.csv"]
size_note = "truthfulness benchmark cache used by legacy runs"
label_fields = ["question", "best_answer", "incorrect_answers"]

[[datasets]]
id = "hallubench"
name = "HalluBench"
source = "AuwAuwAuw/HalluBench"
split = "train"
access = "gated; requires accepted Hugging Face access conditions; CC BY-NC-ND 4.0 non-commercial no-derivatives"
local_cache = []
size_note = "200 geospatial VLM questions across emergency and urban domains; raw samples and images are not committed"
label_fields = ["question_id", "application", "task_type", "output_form", "question", "ground_truth", "img1_path", "img2_path"]

[[datasets]]
id = "ragtruth"
name = "RAGTruth (processed)"
source = "wandb/RAGTruth-processed"
split = "test"
access = "public HuggingFace dataset downloads"
local_cache = []
size_note = "2,700 test responses (943 hallucinated, 1,757 clean) with span-level annotations"
label_fields = ["source_text", "response", "hallucination_labels_processed"]

[[datasets]]
id = "freshqa"
name = "FreshQA"
source = "freshllms/freshqa"
split = "train (600-question evaluation slice)"
access = "public HuggingFace dataset downloads (trust_remote_code)"
local_cache = []
size_note = "600 questions (148 false-premise, 452 valid) for false-premise detection"
label_fields = ["question", "false_premise"]

[[datasets]]
id = "fever_nli"
name = "FEVER (NLI form)"
source = "pietrolesci/nli_fever"
split = "dev (held-out; train split is in the borderline-classifier training mix)"
access = "public HuggingFace dataset downloads"
local_cache = []
size_note = "claim/evidence verification pairs; no committed benchmark artefact yet"
label_fields = ["premise", "hypothesis", "label"]

[[datasets]]
id = "streaming_good_passages"
name = "Streaming known-good passages"
source = "benchmarks/streaming_false_halt_bench.py"
split = "in-repo fixture list"
access = "tracked source fixture"
local_cache = []
size_note = "known-good factual passages for false-halt measurement"
label_fields = ["id", "facts", "passage"]

[[datasets]]
id = "beir_nfcorpus"
name = "BEIR NFCorpus"
source = "BEIR benchmark zips (thakur/BEIR datasets mirror)"
split = "test"
access = "public zip downloads extracted under benchmarks/data/beir/nfcorpus (not committed)"
local_cache = []
size_note = "3,633 documents, 323 test queries, graded qrels"
label_fields = ["query-id", "corpus-id", "score"]

[[datasets]]
id = "beir_scifact"
name = "BEIR SciFact"
source = "BEIR benchmark zips (thakur/BEIR datasets mirror)"
split = "test"
access = "public zip downloads extracted under benchmarks/data/beir/scifact (not committed)"
local_cache = []
size_note = "5,183 documents, 300 test queries, binary qrels"
label_fields = ["query-id", "corpus-id", "score"]

[[datasets]]
id = "streaming_bad_passages"
name = "Streaming labelled bad passages"
source = "benchmarks/streaming_false_halt_bench.py"
split = "in-repo fixture list"
access = "tracked source fixture"
local_cache = []
size_note = "30 labelled contradiction passages for halt precision, recall, and token-timing diagnostics"
label_fields = ["id", "facts", "passage", "expected_fragment"]

[[datasets]]
id = "latency_fixture_pairs"
name = "Latency fixture pairs"
source = "benchmarks/latency_bench.py"
split = "in-repo fixture list"
access = "tracked source fixture"
local_cache = []
size_note = "fixed premise/claim pairs for backend latency runs"
label_fields = ["premise", "claim"]

[[public_accuracy_tables]]
id = "benchmark_report_beir_retrieval"
title = "BENCHMARK_REPORT BEIR retrieval (grounded() hybrid pipeline)"
public_file = "benchmarks/BENCHMARK_REPORT.md"
runner_files = ["benchmarks/beir_competitive_bench.py"]
commands = ["python -m benchmarks.beir_competitive_bench"]
datasets = ["beir_nfcorpus", "beir_scifact"]
cache_files = []
result_files = ["benchmarks/results/beir_competitive_bench.json"]
metrics = ["ndcg_at_10", "recall_at_10", "p50_ms", "p95_ms"]
notes = "Scored with pytrec_eval, cross-checked against a built-in linear-gain nDCG; the artefact embeds the published baseline rows (BEIR paper Table 2; bge-large model-card MTEB metrics) with their sources and caveats."

[[public_accuracy_tables]]
id = "benchmark_report_beir_fusion"
title = "BENCHMARK_REPORT BEIR fusion strategies (hybrid grounded() pipeline)"
public_file = "benchmarks/BENCHMARK_REPORT.md"
runner_files = ["benchmarks/beir_fusion_bench.py"]
commands = ["python -m benchmarks.beir_fusion_bench"]
datasets = ["beir_nfcorpus", "beir_scifact"]
cache_files = []
result_files = ["benchmarks/results/beir_fusion_bench.json"]
metrics = ["ndcg_at_10", "recall_at_10", "p50_ms"]
notes = "All shipped fusion strategies (rrf/convex/combmnz/zscore) as with_fusion() views over one shared index per dataset; rrf__s50_d50 must reproduce the beir_competitive_bench bge_large__none arm exactly (in-artefact regression check). Same scoring and caveats as the competitive bench."

[[public_accuracy_tables]]
id = "readme_scoring_pyramid"
title = "README five-tier scoring pyramid"

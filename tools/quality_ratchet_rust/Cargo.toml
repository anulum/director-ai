# Director-AI — native Rust source quality frontend
[package]
name = "director-quality-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false

[dependencies]
syn = { version = "=3.0.6", default-features = false, features = ["full", "parsing", "visit", "printing"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
serde_json = "=1.0.151"
quote = "=1.0.47"

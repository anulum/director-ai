[tool.setuptools]
# Do not sweep every git-tracked file into the wheel as package data — that would
# re-introduce the excluded BUSL packages' .py files. Only the explicitly declared
# package-data below ships; package source for the included (Apache core) packages
# is included as normal.
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
# Open-core release: the public PyPI wheel ships only the Apache-2.0 core. The
# BUSL-1.1 advanced & labs packages below stay source-available in the repo but
# are excluded from the published wheel. The core imports standalone without them
# (verified via the basic-wheel import simulation); advanced features raise a
# friendly "advanced tier required" error when invoked in a core-only install.
exclude = [
    "director_ai.agentic*",
    "director_ai.compliance*",
    "director_ai.enterprise*",
    "director_ai.experimental*",
    "director_ai.ui*",
    "director_ai.voice*",
    "director_ai.core.agent_identity*",
    "director_ai.core.autopoietic*",
    "director_ai.core.citation_grounding*",
    "director_ai.core.continual_adversarial*",
    "director_ai.core.customer_model_factory*",
    "director_ai.core.defense_genome*",
    "director_ai.core.dp_rag*",
    "director_ai.core.emergence_oracle*",
    "director_ai.core.execution_rings*",
    "director_ai.core.federated_dp*",
    "director_ai.core.financial_services*",
    "director_ai.core.fuzzing*",
    "director_ai.core.interpretability*",
    "director_ai.core.meta_guard*",
    "director_ai.core.ml_bom*",
    "director_ai.core.multimodal_guard*",
    "director_ai.core.multi_scale_alignment*",
    "director_ai.core.neuro_symbolic*",
    "director_ai.core.ontology*",
    "director_ai.core.output_integrity*",
    "director_ai.core.output_trust*",
    "director_ai.core.rasp*",
    "director_ai.core.routing*",
    "director_ai.core.self_evolving*",
    "director_ai.core.self_healing*",
    "director_ai.core.streaming_repair*",
    "director_ai.core.sustainability*",
    "director_ai.core.swarm_economics*",
    "director_ai.core.swarm_equilibrium*",
    "director_ai.core.symbolic_chain*",
    "director_ai.core.temporal_consistency*",
    "director_ai.core.temporal_logic*",
    "director_ai.core.threat_intel*",
    "director_ai.core.trace_safe*",
    "director_ai.core.trajectory*",
]

[tool.setuptools.package-data]
director_ai = [
    "py.typed",
    "core/models/*.json",
    "proto/**/*.pyi",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    "src/director_ai/director_pb2.py",
    "src/director_ai/director_pb2_grpc.py",
    # Generated director.v1 protobuf + gRPC stubs. Regenerated by
    # ``schemas/generate.sh``; hand-editing them is forbidden so
    # they cannot comply with our naming or style rules.
    "src/director_ai/proto/director/v1/director_pb2.py",
    "src/director_ai/proto/director/v1/director_pb2_grpc.py",
    "src/director_ai/proto/director/v1/director_pb2.pyi",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"src/director_ai/__init__.py" = ["F401"]
"notebooks/*.ipynb" = ["N802", "N803", "N806", "B007", "SIM108", "F401", "I001"]
# Ingestion stubs mirror PascalCase API surfaces of boto3 and the
# Google Drive client so operators can swap the stub for the real
# SDK without rewriting signatures.
"tests/test_ingestion_plugins.py" = ["N803"]
# gRPC method names come from protoc as PascalCase; the
# CoherenceScoring servicer overrides them exactly.
"src/director_ai/grpc_scoring.py" = ["N802"]
# Optional-dep test modules: ``pytest.importorskip`` has to run
# before the real imports so the whole suite does not fail when
# the [grpc] / protobuf extras are not installed on a CI runner.
"tests/test_grpc_scoring.py" = ["E402"]
"tests/test_proto_serialization.py" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "consumer: consumer-facing API tests",
    "integration: cross-module integration tests",
    "slow: tests that take > 5s",
    "enterprise: enterprise module tests (tenant, policy, audit)",
    "gpu: GPU-backed integration tests that require a supported CUDA device",
]

[tool.coverage.run]
source = ["src/director_ai"]
branch = true
omit = [
    "src/director_ai/grpc_server.py",       # requires [grpc] extras (grpcio)
    "src/director_ai/grpc_scoring.py",      # requires [grpc] extras (grpcio)
    "src/director_ai/director_pb2.py",      # generated protobuf stubs
    "src/director_ai/director_pb2_grpc.py", # generated gRPC stubs
    "src/director_ai/proto/converters.py",  # protobuf bridge covered in extras
    "src/director_ai/proto/director/v1/director_pb2.py",
    "src/director_ai/proto/director/v1/director_pb2_grpc.py",
    "src/director_ai/enterprise/*",         # requires [enterprise] extras (Redis)
    "src/director_ai/core/finetune.py",     # requires [nli] extras (torch)
    "src/director_ai/core/finetune_benchmark.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 97
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pass",
    "raise NotImplementedError",
    "except ImportError",
    "^\\s*\\.\\.\\.\\s*$",
    ":\\s*\\.\\.\\.\\s*$",
]
partial_branches = [
    "pragma: no branch",
]


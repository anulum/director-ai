warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests", "benchmarks"]
# B101: assert used in tests only (excluded above)
# B104: 0.0.0.0 binding — intentional for Docker/container deployment
# B311: random — used for non-security purposes (sampling, not crypto)
# B608: SQL formatting — parameterized queries used in audit_pg.py
# B615: pyrsa — not used; false positive from dep chain
skips = ["B101", "B104", "B311", "B608", "B615"]

[[tool.mypy.overrides]]
module = "director_ai.director_pb2"
ignore_errors = true

[[tool.mypy.overrides]]
module = "director_ai.director_pb2_grpc"
ignore_errors = true

[[tool.mypy.overrides]]
module = "director_ai.enterprise.redis"
ignore_errors = true

[[tool.mypy.overrides]]
module = "benchmarks.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.uv]
# Keep protobuf on the 6.x line for every supported Python so the committed
# gRPC gencode (6.31.1) matches the runtime. crewai 1.x pulls google-api-core,
# whose grpc extra otherwise drags grpcio-status down to 1.71.2 (protobuf<6) on
# Python <3.14, splitting the universal lock and breaking the stubs.
constraint-dependencies = ["grpcio-status>=1.81.0", "protobuf>=6.31.1"]

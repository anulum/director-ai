# Director-Class AI — Project Configuration

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "director-ai"
version = "3.15.3"
description = "Response-level LLM hallucination guardrail — NLI + RAG fact-checking with audit evidence"
authors = [
    {name = "Miroslav Šotek", email = "protoscience@anulum.li"}
]
license = "Apache-2.0 AND BUSL-1.1"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "llm", "hallucination", "guardrail", "nli", "rag",
    "fact-checking", "streaming", "coherence", "deberta",
    "openai", "anthropic", "langchain",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]
dependencies = [
    "backfire-kernel>=0.1.1,<0.2",
    "numpy>=1.24",
    "requests>=2.32",
]

[tool.uv.sources]
backfire-kernel = { path = "backfire-kernel/crates/backfire-ffi" }


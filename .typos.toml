# Director-Class AI — typos configuration

[default]
# Hexadecimal identifiers (short/full git SHAs, digests) are not prose;
# without this, the checker splits hex runs into pseudo-words and flags
# fragments of commit SHAs quoted in docs as misspellings.
extend-ignore-re = ["\\b[0-9a-f]{8,64}\\b"]

[default.extend-words]
ACI = "ACI"
comando = "comando"
ignora = "ignora"
responde = "responde"
confirme = "confirme"
# Proper noun: HashiCorp Vault (camelCase tokenises to "Hashi" + "Corp")
Hashi = "Hashi"
# Valid English variant (typos prefers "Unparsable"); both spellings are correct
# and it recurs in test docstrings — allow it rather than churn agents' files.
Unparseable = "Unparseable"

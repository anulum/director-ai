# Director-Class AI — typos configuration
#
# CANONICAL and ONLY typos config for this repository (WCH-4). The
# pre-commit hook passes ``--config .typos.toml`` explicitly and the CI
# Pre-commit workflow runs that hook; a loose ``typos`` invocation from any
# directory in the repo discovers this file too, because no ``typos.toml``/
# ``_typos.toml`` (which would win discovery) exists any more — keep it
# that way. Run report-only; never ``--write-changes``.

[default]
# Hexadecimal identifiers (short/full git SHAs, digests) are not prose;
# without this, the checker splits hex runs into pseudo-words and flags
# fragments of commit SHAs quoted in docs as misspellings.
extend-ignore-re = ["\\b[0-9a-f]{8,64}\\b"]

[default.extend-words]
# Domain / library vocabulary
ACI = "ACI"
aadd = "aadd"
arange = "arange"
ba = "ba"
BA = "BA"
deberta = "deberta"
fo = "fo"
FPR = "FPR"
fpr = "fpr"
grpc = "grpc"
hallucinated = "hallucinated"
hel = "hel"
hlt = "hlt"
inout = "inout"
nd = "nd"
ND = "ND"
nli = "nli"
onnx = "onnx"
otel = "otel"
qdrant = "qdrant"
rag = "rag"
ser = "ser"
strat = "strat"
thr = "thr"
Tru = "Tru"
Wice = "Wice"
# Proper noun: HashiCorp Vault (camelCase tokenises to "Hashi" + "Corp")
Hashi = "Hashi"
# Valid English variant (typos prefers "Unparsable"); both spellings are correct
# and it recurs in test docstrings — allow it rather than churn agents' files.
Unparseable = "Unparseable"
# Substring match for "summarise/summarize" in task type detection
summar = "summar"
# zk-SNARK proving system names (Jens Groth 2016, Plonk; not typos).
# ``groth`` alone is the typos token after numeric split — must
# whitelist it so ``groth16`` passes.
groth = "groth"
groth16 = "groth16"
plonk = "plonk"
# Julia package name in tools/julia_tuner/Manifest.toml — not a plural typo
Missings = "Missings"
# ``anc`` / ``anc_a`` / ``anc_b`` are shorthand for "ancestor" in
# the ontology consistency checker; not a typo for "and".
anc = "anc"
# Non-English words in multilingual injection adversarial patterns and
# multilingual test corpora (German, French, Italian, Spanish, Slovak…);
# not typos for their English near-neighbours.
Alle = "Alle"
alle = "alle"
appareil = "appareil"
cliente = "cliente"
comando = "comando"
confirme = "confirme"
daty = "daty"
entreprise = "entreprise"
garantie = "garantie"
ignora = "ignora"
Mata = "Mata"
responde = "responde"
Responde = "Responde"
Rispondi = "Rispondi"
Sie = "Sie"
Tage = "Tage"

[files]
extend-exclude = [
    "*.npz",
    "*.npy",
    "*.onnx",
    "*.pkl",
    "*.pt",
    "*.model",
    "backfire-kernel/target/",
    "benchmarks/*.jsonl",
    "benchmarks/models/**",
    "benchmarks/results/**",
    "benchmarks/scores/**",
    "notebooks/**",
    # Julia dependency lockfile — regenerated by Pkg.resolve(),
    # hand-editing typos-flagged package names would break the lock.
    "tools/julia_tuner/Manifest.toml",
]

# Director-Class AI - HaltMonitor proof manifest

id = "halt-monitor-proof-boundary"
root = "formal/HaltMonitor"
lean_toolchain = "formal/HaltMonitor/lean-toolchain"
model = "formal/HaltMonitor/HaltMonitor/Core.lean"
properties = "formal/HaltMonitor/HaltMonitor/Properties.lean"
monotonicity = "formal/HaltMonitor/HaltMonitor/Monotonicity.lean"
python_surface = "src/director_ai/core/runtime/kernel.py"
rust_surface = "backfire-kernel/crates/backfire-core"
fixture_family = "halt-monitor-contract"

[[theorems]]
name = "run_emitted_preserves_input"
file = "formal/HaltMonitor/HaltMonitor/Properties.lean"
claim = "An emitted result preserves the input token projection."
contract = "emitted-stream-token-order"

[[theorems]]
name = "run_emitted_implies_all_pass"
file = "formal/HaltMonitor/HaltMonitor/Properties.lean"
claim = "An emitted result means every input item passed the threshold."
contract = "emitted-stream-threshold-pass"

[[theorems]]
name = "run_any_fail_implies_not_emitted"
file = "formal/HaltMonitor/HaltMonitor/Properties.lean"
claim = "Any failing score prevents an emitted result."
contract = "failing-score-not-emitted"

[[theorems]]
name = "run_any_fail_implies_halted"
file = "formal/HaltMonitor/HaltMonitor/Properties.lean"
claim = "Any failing score forces the halted constructor."
contract = "failing-score-halts"

[[theorems]]
name = "passes_antitone"
file = "formal/HaltMonitor/HaltMonitor/Monotonicity.lean"
claim = "Passing a stricter (higher) threshold implies passing any looser one."
contract = "threshold-pass-antitone"

[[theorems]]
name = "run_all_pass_emitted"
file = "formal/HaltMonitor/HaltMonitor/Monotonicity.lean"
claim = "If every item passes the threshold, the run emits the whole input."
contract = "all-pass-emits"

[[theorems]]
name = "run_threshold_monotone"
file = "formal/HaltMonitor/HaltMonitor/Monotonicity.lean"
claim = "Lowering the threshold cannot turn an emitting stream into a halting one."
contract = "threshold-monotone-emit"

# Director-AI starter preset: low-latency edge or offline deployments.
# No heavyweight model loading; use for approximate local screening.
profile: edge_offline
mode: auto
coherence_threshold: 0.50
hard_limit: 0.35
soft_limit: 0.55
use_nli: false
scorer_backend: rules
max_candidates: 1
hybrid_retrieval: false
reranker_enabled: false
metrics_enabled: false
sanitize_inputs: true
injection_detection_enabled: false
w_logic: 0.5
w_fact: 0.5
rate_limit_rpm: 0
log_json: false

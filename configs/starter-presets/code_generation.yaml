# Director-AI starter preset: code generation and tool-output review.
# Pair with structured verifiers for JSON, numeric, and tool-call outputs.
profile: code_generation
mode: auto
coherence_threshold: 0.58
hard_limit: 0.40
soft_limit: 0.65
use_nli: true
scorer_backend: hybrid
llm_judge_enabled: true
llm_judge_provider: local
hybrid_retrieval: false
reranker_enabled: false
retrieval_abstention_threshold: 0.0
w_logic: 0.70
w_fact: 0.30
nli_fact_retrieval_top_k: 3
nli_claim_coverage_enabled: true
nli_claim_support_threshold: 0.65
sanitize_inputs: true
injection_detection_enabled: true
injection_threshold: 0.75
metrics_enabled: true
otel_enabled: true

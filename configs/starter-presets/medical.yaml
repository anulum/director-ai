# SPDX-License-Identifier: Apache-2.0
# Director-AI starter preset: biomedical or clinical fact review.
# High-stakes use requires curated KB grounding and domain calibration.
profile: medical
mode: grounded
coherence_threshold: 0.30
hard_limit: 0.20
soft_limit: 0.35
use_nli: true
scorer_backend: hybrid
llm_judge_enabled: true
llm_judge_provider: local
vector_backend: chroma
hybrid_retrieval: true
reranker_enabled: true
reranker_top_k_multiplier: 5
retrieval_abstention_threshold: 0.42
w_logic: 0.5
w_fact: 0.5
nli_fact_retrieval_top_k: 8
nli_claim_coverage_enabled: true
nli_claim_support_threshold: 0.72
adaptive_threshold_enabled: true
threshold_fact_check: 0.56
threshold_rag: 0.78
redact_pii: true
audit_log_path: ~/.director-ai/audit-medical.jsonl
metrics_enabled: true
otel_enabled: true

# Director-Class AI — heavy optional dependency policy

[policy]
doc = "docs-site/deployment/supply-chain.md"
lock_file = "uv.lock"
optional_lock_policy = "requirements/uv_extra_lock_policy.toml"
export_requirements = "requirements/docker-gpu-export.txt"
required_controls = [
    "upper-bound",
    "uv-lock",
    "runtime-isolation",
    "sbom",
    "audit",
    "fallback",
]

[[packages]]
name = "torch"
extra = "nli"
risk = "native-code"
controls = ["upper-bound", "uv-lock", "runtime-isolation", "audit", "fallback"]

[[packages]]
name = "transformers"
extra = "nli"
risk = "model-loader"
controls = ["upper-bound", "uv-lock", "runtime-isolation", "audit", "fallback"]

[[packages]]
name = "onnxruntime"
extra = "onnx"
risk = "native-runtime"
controls = ["upper-bound", "uv-lock", "runtime-isolation", "audit", "fallback"]

[[packages]]
name = "onnxruntime-gpu"
extra = "tensorrt"
risk = "native-gpu-runtime"
controls = ["upper-bound", "uv-lock", "runtime-isolation", "audit", "fallback"]

[[packages]]
name = "mujoco"
extra = "physical"
risk = "native-simulation-runtime"
controls = ["upper-bound", "uv-lock", "runtime-isolation", "audit", "fallback"]

[[packages]]
name = "chromadb"
extra = "vector"
risk = "local-store"
controls = ["upper-bound", "uv-lock", "runtime-isolation", "audit", "fallback"]

[[packages]]
name = "sentence-transformers"
extra = "vector"
risk = "embedding-model-loader"
controls = ["upper-bound", "uv-lock", "runtime-isolation", "audit", "fallback"]

[[packages]]
name = "gradio"
extra = "ui"
risk = "web-ui"
controls = ["upper-bound", "uv-lock", "runtime-isolation", "audit"]

[[export_only]]
name = "optimum"
requirements = "requirements/docker-gpu-export.txt"
risk = "export-model-loader"
controls = ["hash-pin", "isolated-build-stage"]

[[export_only]]
name = "optimum-onnx"
requirements = "requirements/docker-gpu-export.txt"
risk = "export-model-loader"
controls = ["hash-pin", "isolated-build-stage"]

[[external_runtime]]
name = "rclpy"
source = "ROS 2 distribution"
risk = "robotics-middleware"
controls = ["runtime-isolation", "audit", "fallback"]

[[external_runtime]]
name = "carla"
source = "CARLA vendor package"
risk = "native-simulation-runtime"
controls = ["runtime-isolation", "audit", "fallback"]

[[external_runtime]]
name = "arkworks"
source = "operator-supplied zk adapter"
risk = "proof-backend"
controls = ["runtime-isolation", "audit", "fallback"]

[[external_runtime]]
name = "gnark"
source = "operator-supplied zk adapter"
risk = "proof-backend"
controls = ["runtime-isolation", "audit", "fallback"]

[[external_runtime]]
name = "snarkjs"
source = "operator-supplied zk adapter"
risk = "proof-backend"
controls = ["runtime-isolation", "audit", "fallback"]

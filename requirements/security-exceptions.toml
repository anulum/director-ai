# Director-AI — governed security-scan exception register
#
# Each accepted dependency / SAST finding that the CI security gates may pass
# MUST be listed here with an owner, a reason, a compensating control, and an
# expiry. `tools/check_security_exceptions.py` validates this file in CI and
# fails the build on a malformed or EXPIRED entry, so a tolerated finding can
# never become a silent, permanent debt. Anything not listed here must fail the
# gate once the gate is flipped to enforcing.
#
# Example entry (copy, fill, and remove the leading '#'):
#
#   [[exceptions]]
#   id = "GHSA-xxxx-xxxx-xxxx"          # advisory id from the scanner
#   tool = "pip-audit"                  # pip-audit | uv-audit | npm-audit | semgrep | bandit | dependabot
#   package = "torch"                   # affected package or rule
#   reason = "No fixed release; not reachable from shipped code paths."
#   compensating_control = "torch only used in optional [nli]/[finetune] extras; \
#     not in the default install or server hot path."
#   owner = "protoscience@anulum.li"
#   opened = "2026-06-07"
#   expires = "2026-09-07"             # ISO date; build goes red after this
#   scope = "ci-dependency-audit"

schema_version = "director.security_exceptions.v1"

# The owner-ruled 2026-07-17 MCP exceptions were closed on 2026-09-30.
# Semgrep 1.179.0 resolves mcp 1.29.0, above all three fixed-version
# floors (1.27.2 / 1.28.1). The historical ruling remains in Git history.
# tests/test_security_exceptions.py rejects reintroduced waivers or a
# vulnerable SAST pin; the generic validator still rejects expired entries.

# The twelve owner-approved PyJWT CI-SAST exceptions were closed on
# 2026-10-02. Semgrep 1.179.0 permits PyJWT >=2.15.0,<3 and the native lock

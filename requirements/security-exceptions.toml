# Director-Class AI - governed security-scan exception register
#
# Each accepted dependency / SAST finding that the CI security gates may pass
# MUST be listed here with an owner, a reason, a compensating control, and an
# expiry. `tools/check_security_exceptions.py` validates this file in CI and
# fails the build on a malformed or EXPIRED entry, so a tolerated finding can
# never become a silent, permanent debt. Anything not listed here must fail the
# gate once the gate is flipped to enforcing.
#
# Example entry (copy, fill, and remove the leading '#'):
#
#   [[exceptions]]
#   id = "GHSA-xxxx-xxxx-xxxx"          # advisory id from the scanner
#   tool = "pip-audit"                  # pip-audit | semgrep | bandit | dependabot
#   package = "torch"                   # affected package or rule
#   reason = "No fixed release; not reachable from shipped code paths."
#   compensating_control = "torch only used in optional [nli]/[finetune] extras; \
#     not in the default install or server hot path."
#   owner = "protoscience@anulum.li"
#   opened = "2026-06-07"
#   expires = "2026-09-07"             # ISO date; build goes red after this
#   scope = "ci-dependency-audit"

schema_version = "director.security_exceptions.v1"

# The owner-ruled 2026-07-17 MCP exceptions were closed on 2026-09-30.
# Semgrep 1.178.0 now resolves mcp 1.29.0, above all three fixed-version
# floors (1.27.2 / 1.28.1). The historical ruling remains in Git history.
# tests/test_security_exceptions.py rejects reintroduced waivers or a
# vulnerable SAST pin; the generic validator still rejects expired entries.

# Owner approved on 2026-09-30: only the 12 PyJWT findings below, only the
# CI SAST lock, expiring on 2026-10-17. No runtime waiver or metadata override.

[[exceptions]]
id = "GHSA-2gx3-rcp4-g85q"
tool = "dependabot"
package = "pyjwt"
reason = "Semgrep 1.178.0, the latest published release, requires PyJWT>=2.13.0,<2.14.dev0; all fixes require 2.14.0 or 2.15.0. Native resolution rejects Semgrep plus PyJWT>=2.15.0; do not override upstream package metadata."
compensating_control = "Affected PyJWT 2.13.0 appears only in requirements/ci-sast.txt. The official Semgrep wheel calls JWT only from its MCP server token verifier; this repository invokes semgrep scan and never starts that MCP server. The actual Python 3.12 CI scan returned zero findings; source inspection confines Python JWT references to the unused MCP token verifier. The attempted Python call trace did not survive entry-point process replacement and is not negative reachability evidence. Root runtime and other profiles use patched versions when present. Recheck reachability, lock version and advisory floors before any change; remove the exception after a compatible upstream release."
owner = "protoscience@anulum.li"
opened = "2026-09-30"
expires = "2026-10-17"
scope = "dependabot-ci-sast-lock"


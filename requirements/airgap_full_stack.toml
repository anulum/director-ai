# Director-Class AI — airgap full-stack manifest

[policy]
doc = "docs-site/deployment/airgap.md"
script = "scripts/airgap_full_stack_example.sh"
lock_file = "uv.lock"
wheelhouse = "wheelhouse/"
model_root = "models/"
onnx_dir = "models/factcg-onnx/"
rust_wheel_dir = "wheelhouse/rust/"
install_extras = ["server", "vector", "nli", "onnx", "ui"]
optional_packages = ["backfire-kernel==0.1.0"]

[[models]]
key = "nli"
name = "yaxili96/FactCG-DeBERTa-v3-Large"
revision = "0430e3509dbd28d2dff7a117c0eae25359ff3e80"
local_dir = "models/hf/yaxili96/FactCG-DeBERTa-v3-Large"

[[models]]
key = "embedding"
name = "BAAI/bge-large-en-v1.5"
revision = "d4aa6901d3a41ba39fb536a557fa166f842b0e09"
local_dir = "models/hf/BAAI/bge-large-en-v1.5"

[[models]]
key = "reranker"
name = "cross-encoder/ms-marco-MiniLM-L-6-v2"
revision = "c5ee24cb16019beea0893ab7796b1df96625c6b8"
local_dir = "models/hf/cross-encoder/ms-marco-MiniLM-L-6-v2"

[onnx]
required_files = [
    "model.onnx",
    "config.json",
    "tokenizer.json",
    "tokenizer_config.json",
    "special_tokens_map.json",
]

[checks]
commands = [
    "UV_OFFLINE=1 uv sync --locked --offline --active --extra server --extra vector --extra nli --extra onnx --extra ui",
    "uv pip install --offline --find-links wheelhouse/rust backfire-kernel==0.1.0",
    "director-ai doctor",
]

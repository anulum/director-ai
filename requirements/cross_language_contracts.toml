# Director-Class AI - cross-language contract manifest

id = "cross-language-contracts"
status = "active"
roadmap_item = "Add cross-language contract tests for Python, Rust, Go, and proto boundaries using property-based inputs."

[[boundaries]]
id = "python-proto-v1"
schema = "schemas/proto/director/v1/director.proto"
implementation = "src/director_ai/proto/converters.py"
generated = "src/director_ai/proto/director/v1/director_pb2.py"
tests = [
  "tests/test_cross_language_contracts.py",
  "tests/test_proto_serialization.py",
]

[[boundaries]]
id = "go-proto-v1"
schema = "schemas/proto/director/v1/director.proto"
implementation = "gateway/go/proto/director/v1/director.pb.go"
generated = "gateway/go/proto/director/v1/director_grpc.pb.go"
tests = [
  "gateway/go/proto/director/v1/roundtrip_test.go",
  "gateway/go/proto/director/v1/property_contract_test.go",
]

[[boundaries]]
id = "rust-python-score"
schema = "backfire-kernel/crates/backfire-types/src/score.rs"
implementation = "src/director_ai/core/types.py"
generated = ""
tests = [
  "tests/test_cross_language_contracts.py",
  "backfire-kernel/crates/backfire-types/src/score.rs",
]

[[gates]]
id = "python-contracts"
command = "pytest tests/test_cross_language_contracts.py tests/test_proto_serialization.py"

[[gates]]
id = "go-contracts"
command = "go test ./proto/director/v1"
working_directory = "gateway/go"

[[gates]]
id = "rust-contracts"
command = "cargo test -p backfire-types"
working_directory = "backfire-kernel"
